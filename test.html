const db=supabase.createClient('https://wfxuxrvygyzonkflpwoq.supabase.co','sb_publishable_e2h4t8AvCobzftt36UrDbw_NJGq8qlJ'),root=document.querySelector('#root'),overlay=document.querySelector('#overlay');let pageName='overview',data={content:[],services:[],reviews:[]},session;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const toast=s=>{const t=document.createElement('div');t.className='toast';t.textContent=s;document.body.append(t);setTimeout(()=>t.remove(),2400)};
async function boot(){session=(await db.auth.getSession()).data.session;session?app():login()}function login(){root.innerHTML=`<div class="login-wrap"><form class="login-card" id="login"><div class="login-brand"><div class="mark">47</div><div><h1>Studio 47</h1><span class="eyebrow">Salon admin</span></div></div><p>Sign in to manage the Studio 47 website.</p><div id="err"></div><div class="stack"><input name="email" type="email" required placeholder="Email"><input name="password" type="password" required placeholder="Password"><button class="primary">Sign in</button></div></form></div>`;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),r=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(r.error)return document.querySelector('#err').innerHTML='<div class="error">Email or password is incorrect.</div>';session=r.data.session;app()}}
function app(){root.innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><div class="mark">47</div><div><strong>Studio 47</strong><small>Salon admin · v2</small></div></div><div class="nav-label">Workspace</div><nav class="nav"><button data-page="overview"><span class="ico"><i class="fa-solid fa-house"></i></span>Overview</button><button data-page="reviews"><span class="ico"><i class="fa-solid fa-star"></i></span>Reviews<span class="badge" id="badge">0</span></button><button data-page="content"><span class="ico"><i class="fa-regular fa-images"></i></span>Gallery</button><button data-page="services"><span class="ico"><i class="fa-solid fa-scissors"></i></span>Menu & Pricing</button><button data-page="appointments"><span class="ico"><i class="fa-regular fa-calendar-check"></i></span>Appointments</button><button data-page="team"><span class="ico"><i class="fa-solid fa-user-group"></i></span>Team</button></nav><div class="nav-label">Website</div><nav class="nav"><a href="index.html" target="_blank"><span class="ico"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>View site</a><button id="out"><span class="ico"><i class="fa-solid fa-right-from-bracket"></i></span>Sign out</button></nav><div class="sidebar-card"><small>Website status</small><strong>Connected and ready.</strong><p>Live updates publish automatically.</p></div></aside><main><header class="topbar"><div class="crumb">Studio 47 / <strong id="crumb">Overview</strong></div><div class="top-actions"><input class="search" id="search" placeholder="Search current page…"><button class="icon-btn" id="refresh"><i class="fa-solid fa-rotate"></i></button><button class="avatar">${esc((session.user.email||'SM').slice(0,2).toUpperCase())}</button></div></header><div id="view"><div class="loading">Loading dashboard…</div></div></main></div>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{pageName=b.dataset.page;render()});document.querySelector('#out').onclick=async()=>{await db.auth.signOut();login()};document.querySelector('#refresh').onclick=()=>load(true);document.querySelector('#search').oninput=e=>document.querySelectorAll('#rows tr').forEach(r=>r.hidden=!r.dataset.search.includes(e.target.value.toLowerCase()));load()}
async function load(note=false){const r=await Promise.all([db.from('site_content').select('*').order('sort_order'),db.from('services').select('*').order('sort_order'),db.from('reviews').select('*').order('created_at',{ascending:false})]),err=r.find(x=>x.error)?.error;if(err)return document.querySelector('#view').innerHTML=`<div class="page-head"><div><div class="eyebrow">Dashboard</div><h1>Unable to load data</h1><p>${esc(err.message)}</p></div></div>`;data={content:r[0].data,services:r[1].data,reviews:r[2].data};document.querySelector('#badge').textContent=data.reviews.filter(x=>!x.is_live).length;render();if(note)toast('Dashboard refreshed')}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===pageName));document.querySelector('#crumb').textContent=pageName==='content'?'Gallery':pageName[0].toUpperCase()+pageName.slice(1);document.querySelector('#search').value='';pageName==='overview'?overview():manager()}
function overview(){const pr=data.reviews.filter(x=>!x.is_live),pc=data.content.filter(x=>x.section==='gallery'&&!x.is_live),avg=data.reviews.length?(data.reviews.reduce((a,x)=>a+x.rating,0)/data.reviews.length).toFixed(1):'—',queue=[...pc.map(x=>({...x,type:'Media'})),...pr.map(x=>({...x,title:x.author,type:'Review'}))];document.querySelector('#view').innerHTML=`<section class="welcome"><div><div class="eyebrow">Website overview</div><h1>Good ${new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'}, Studio 47.</h1><p>Here’s what’s happening across your website.</p></div><div class="date-chip">${new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})} · Las Vegas</div></section><section class="metrics"><article class="metric"><div class="metric-top"><span>Gallery</span><span class="metric-icon"><i class="fa-regular fa-images"></i></span></div><strong>${data.content.filter(x=>x.section==='gallery').length}</strong><span class="delta">${data.content.filter(x=>x.section==='gallery'&&x.is_live).length} live gallery items</span></article><article class="metric"><div class="metric-top"><span>Services</span><span class="metric-icon"><i class="fa-solid fa-scissors"></i></span></div><strong>${data.services.length}</strong><span class="delta">${data.services.filter(x=>x.is_live).length} live services</span></article><article class="metric"><div class="metric-top"><span>Pending approvals</span><span class="metric-icon"><i class="fa-regular fa-rectangle-list"></i></span></div><strong>${queue.length}</strong><span class="delta neutral">${pc.length} gallery items · ${pr.length} reviews</span></article><article class="metric"><div class="metric-top"><span>Average rating</span><span class="metric-icon"><i class="fa-solid fa-star"></i></span></div><strong>${avg}</strong><span class="delta">${data.reviews.length} total reviews</span></article></section><section class="layout"><article class="card"><div class="card-head"><div><div class="eyebrow">Website control</div><h2>Upcoming Appointments</h2><p>Today first, then future dates</p></div><button class="ghost" onclick="pageName='content';render()">Manage gallery</button></div><div class="queue">${queue.slice(0,6).map(x=>`<div class="queue-item"><div class="thumb"><i class="fa-solid ${x.type==='Review'?'fa-star':'fa-pen'}"></i></div><div><strong>${esc(x.title||x.content_key)}</strong><small>${x.type} · waiting for approval</small></div><span class="state">Not live</span></div>`).join('')||'<div class="empty">Everything is published.</div>'}</div></article><aside class="card"><div class="card-head"><div><div class="eyebrow">Reputation</div><h2>Ratings snapshot</h2></div><button class="ghost" onclick="pageName='reviews';render()">View all</button></div><div class="rating"><div class="score">${avg}</div><div class="stars">${avg==='—'?'No ratings yet':'★★★★★'}</div><small>${data.reviews.length} reviews</small>${data.reviews.slice(0,3).map(x=>`<div class="review"><strong>${esc(x.author)} · ${'★'.repeat(x.rating)}</strong><p>“${esc(x.body)}”</p><small>${x.is_live?'Live':'Awaiting approval'}</small></div>`).join('')}</div></aside></section>`}
const cfg={content:{title:'Gallery',sub:'Website media',desc:'Manage the images and videos shown on the website.',table:'site_content'},services:{title:'Menu & Pricing',sub:'Services',desc:'Manage services, descriptions, prices, and order.',table:'services'},reviews:{title:'Reviews',sub:'Reputation',desc:'Approve submissions or add reviews manually.',table:'reviews'}};function vals(r){return pageName==='content'?[r.title||r.content_key,r.section,r.content_value||r.image_url]:pageName==='services'?[r.name,r.price,r.description]:[r.author,'★'.repeat(r.rating),r.body]}function heads(){return pageName==='content'?['Media','Section','Type']:pageName==='services'?['Service','Price','Description']:['Client','Rating','Review']}

async function uploadGalleryFile(file){const path=`gallery/${crypto.randomUUID()}.${galleryExtension(file)}`,result=await db.storage.from('portfolio').upload(path,file,{contentType:file.type,cacheControl:'31536000',upsert:false});if(result.error)throw new Error(`Storage upload failed: ${result.error.message}`);const publicUrl=db.storage.from('portfolio').getPublicUrl(path).data.publicUrl;if(!publicUrl)throw new Error('Storage did not return a public URL.');return publicUrl}
addGalleryFiles=async function(files){const allowed=files.filter(file=>file.type.startsWith('image/')||file.type.startsWith('video/')),status=document.querySelector('#dropStatus');if(!allowed.length)return toast('Choose image or video files');status.textContent=`Uploading 0 of ${allowed.length}…`;let added=0,nextOrder=Math.max(0,...data.content.filter(x=>x.section==='gallery').map(x=>Number(x.sort_order)||0))+1;for(const file of allowed){try{const mediaUrl=await uploadGalleryFile(file),record={section:'gallery',content_key:`gallery_${Date.now()}_${added}`,content_value:JSON.stringify({media_type:file.type,file_name:file.name}),image_url:mediaUrl,title:'',sort_order:nextOrder++,is_live:false},{error}=await db.from('site_content').insert(record);if(error)throw error;added++;status.textContent=`Uploaded ${added} of ${allowed.length}…`}catch(error){status.textContent=`Uploaded ${added}. ${error.message}`;alert(error.message);break}}if(added){await normalizeGalleryOrder();toast(`${added} gallery item${added===1?'':'s'} uploaded to Storage`);await load()}};
async function migrateGalleryVideos(){const videos=data.content.filter(x=>x.section==='gallery'&&String(x.image_url||'').startsWith('data:video/'));if(!videos.length)return toast('No database-stored videos need migration');if(!confirm(`Move ${videos.length} existing video${videos.length===1?'':'s'} into Supabase Storage?`))return;const button=document.querySelector('#migrateVideos');button.disabled=true;for(let index=0;index<videos.length;index++){button.textContent=`Migrating ${index+1} of ${videos.length}…`;try{const response=await fetch(videos[index].image_url),blob=await response.blob(),file=new File([blob],`video-${videos[index].id}.${galleryExtension({name:'',type:blob.type})}`,{type:blob.type}),publicUrl=await uploadGalleryFile(file),{error}=await db.from('site_content').update({image_url:publicUrl,content_value:JSON.stringify({media_type:blob.type,file_name:file.name})}).eq('id',videos[index].id);if(error)throw error}catch(error){button.disabled=false;button.textContent='Migrate existing videos';return alert(`Migration stopped: ${error.message}`)}}await normalizeGalleryOrder();toast('Existing videos moved to Storage');await load()}
const setupGalleryDropzoneBeforeStorage=setupGalleryDropzone;setupGalleryDropzone=function(){setupGalleryDropzoneBeforeStorage();const zone=document.querySelector('#galleryDropzone');if(!zone)return;const button=document.createElement('button');button.type='button';button.id='migrateVideos';button.className='ghost';button.textContent='Migrate existing videos';button.onclick=e=>{e.stopPropagation();migrateGalleryVideos()};zone.append(button)};
const galleryInOrder=()=>data.content.filter(item=>item.section==='gallery').sort((a,b)=>(Number(a.sort_order)||0)-(Number(b.sort_order)||0)||String(a.id||'').localeCompare(String(b.id||'')));
const rowBeforeOrderedGallery=row;
row=function(item){if(pageName!=='content')return rowBeforeOrderedGallery(item);const ordered=galleryInOrder(),position=ordered.findIndex(entry=>entry.id===item.id)+1,video=isVideoMedia(item.image_url)||String(item.image_url).startsWith('data:video/'),preview=video?`<video class="gallery-preview" src="${esc(item.image_url)}" muted playsinline preload="metadata"></video>`:`<img class="gallery-preview" src="${esc(item.image_url)}" alt="Gallery preview">`,mediaType=video?'Video':'Image';return `<tr data-search="${mediaType.toLowerCase()} ${position}"><td><strong>#${position}</strong></td><td class="cell"><div class="preview-cell">${preview}<div><strong>${mediaType}</strong><small>${esc(item.id.slice(0,8))}</small></div></div></td><td>${mediaType}</td><td><button class="toggle ${item.is_live?'live':'draft'}" data-toggle="${item.id}" data-live="${item.is_live}">${item.is_live?'Live':'Not live'}</button></td><td><div class="row-actions"><button class="ghost" data-move="${item.id}" data-direction="-1" aria-label="Move up" ${position===1?'disabled':''}>↑</button><button class="ghost" data-move="${item.id}" data-direction="1" aria-label="Move down" ${position===ordered.length?'disabled':''}>↓</button><button class="ghost" data-edit="${item.id}">Edit</button><button class="danger" data-delete="${item.id}">Delete</button></div></td></tr>`};
const headsBeforeOrderedGallery=heads;
heads=function(){return pageName==='content'?['Order','Media','Type']:headsBeforeOrderedGallery()};
normalizeGalleryOrder=async function(items=galleryInOrder()){for(let index=0;index<items.length;index++){const wanted=index+1;if(Number(items[index].sort_order)===wanted)continue;const {error}=await db.from('site_content').update({sort_order:wanted}).eq('id',items[index].id);if(error)throw error;items[index].sort_order=wanted}};
moveGallery=async function(id,direction){const items=galleryInOrder(),index=items.findIndex(item=>item.id===id),target=index+direction;if(index<0||target<0||target>=items.length)return;[items[index],items[target]]=[items[target],items[index]];try{await normalizeGalleryOrder(items);toast('Gallery order updated');await load()}catch(error){alert(`Gallery order could not be saved: ${error.message}`)}};
const loadBeforeOrderedGallery=load;
load=async function(note=false){await loadBeforeOrderedGallery(note);if(data?.content){const gallery=galleryInOrder(),others=data.content.filter(item=>item.section!=='gallery');data.content=[...gallery,...others];if(pageName==='content')render()}};
boot();
</script></body></html>
