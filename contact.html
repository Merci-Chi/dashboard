<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Contact</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" href="pipeline.css"></head><body><main class="wrap"><header class="top"><div><span class="kicker">KIARA ACCESS</span><h1>Contact</h1><p class="subtitle">Contact businesses with completed sites, then move confirmed customers to Clients.</p></div><i class="bi bi-envelope-fill" style="font-size:36px;color:#2f92ff"></i></header><div class="status" id="status"></div><section class="cards" id="list"></section></main><script src="pipeline.js"></script><script>(()=>{const root=document.getElementById('list'),status=document.getElementById('status');async function load(){try{const sites=await SitePipeline.list(['contact']);root.innerHTML=sites.map(x=>`<article class="card"><div class="card-main"><i class="bi bi-envelope-fill" style="color:#2f92ff;font-size:22px"></i><div class="company"><strong>${SitePipeline.escapeHTML(x.company)}</strong><span>${SitePipeline.escapeHTML(x.phone||x.email)}</span></div><div class="checks"><label class="check-pill"><input type="checkbox" data-contacted="${x.id}" ${x.contacted?'checked':''}>Contacted</label><label class="check-pill"><input type="checkbox" data-interested="${x.id}" ${x.interested?'checked':''}>Interested</label></div><div class="review-actions"><button class="btn secondary" data-back="${x.id}">Back to Live</button><button class="btn" data-next="${x.id}" ${x.interested?'':'disabled'}>Send to Clients</button></div></div></article>`).join('')||'<div class="empty"><div><i class="bi bi-envelope-fill"></i><strong>No sites ready for contact.</strong></div></div>'}catch(e){status.textContent=e.message}}root.addEventListener('change',async e=>{const id=e.target.dataset.contacted||e.target.dataset.interested;if(!id)return;await SitePipeline.update(id,e.target.dataset.contacted?{contacted:e.target.checked}:{interested:e.target.checked});load()});root.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.back)await SitePipeline.update(b.dataset.back,{status:'live'});if(b.dataset.next)await SitePipeline.update(b.dataset.next,{status:'client'});load()});load()})();</script></body></html>
