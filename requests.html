<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Website Requests</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root{color-scheme:dark;--bg:#020a12;--panel:#071521;--panel2:#0b1d2d;--line:#17344f;--text:#edf6ff;--muted:#7f9bb5;--blue:#2f92ff;--green:#35c58b;--amber:#f4b84b;--red:#f06478}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 0,#0d2840 0,transparent 33%),var(--bg);color:var(--text);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.page{max-width:1450px;margin:auto;padding:32px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.eyebrow{color:var(--blue);font-size:11px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}.head h1{margin:5px 0 4px;font-size:clamp(30px,4vw,46px);line-height:1.05}.head p{margin:0;color:var(--muted)}.refresh{min-height:42px;padding:0 15px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--text);font-weight:800;cursor:pointer}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.metric,.card{border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,var(--panel2),var(--panel));box-shadow:0 18px 45px #0005}.metric{padding:17px}.metric span{color:var(--muted);font-weight:750}.metric strong{display:block;margin-top:7px;font-size:27px}.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) repeat(3,minmax(145px,190px));gap:10px;margin-bottom:14px}.toolbar input,.toolbar select{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:11px;background:#06111c;color:var(--text);outline:0}.toolbar input:focus,.toolbar select:focus{border-color:var(--blue)}.list{display:grid;gap:11px}.request{padding:18px}.request-top{display:flex;align-items:center;justify-content:space-between;gap:14px}.tags{display:flex;flex-wrap:wrap;gap:7px}.tag{padding:5px 9px;border-radius:999px;background:#13314b;color:#9fcef8;font-size:10px;font-weight:900;letter-spacing:.05em;text-transform:uppercase}.tag.bug{background:#421c28;color:#ff9aad}.tag.urgent,.tag.high{background:#452d12;color:#ffd27b}.request h2{margin:13px 0 5px;font-size:18px}.request p{margin:0;color:#b8c9d9;white-space:pre-wrap;overflow-wrap:anywhere}.meta{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:13px;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px}.actions select,.delete{min-height:38px;border:1px solid var(--line);border-radius:9px;background:#06111c;color:var(--text);padding:0 10px}.delete{width:38px;padding:0;color:#ff91a2;cursor:pointer}.empty,.error{padding:45px;text-align:center;color:var(--muted)}.error{color:#ff91a2}@media(max-width:850px){.page{padding:20px 14px}.metrics{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.request-top{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions select{flex:1}}@media(max-width:480px){.head{align-items:flex-start;flex-direction:column}.refresh{width:100%}.toolbar{grid-template-columns:1fr}.toolbar input{grid-column:auto}.metrics{gap:8px}.metric{padding:13px}.request{padding:14px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="head"><div><div class="eyebrow">Client support</div><h1>Website Requests</h1><p>Bug reports and website changes submitted by clients.</p></div><button class="refresh" id="refresh"><i class="bi bi-arrow-clockwise"></i> Refresh</button></header>
    <section class="metrics"><article class="metric"><span>All requests</span><strong id="total">—</strong></article><article class="metric"><span>New</span><strong id="newCount">—</strong></article><article class="metric"><span>In progress</span><strong id="progressCount">—</strong></article><article class="metric"><span>Completed</span><strong id="doneCount">—</strong></article></section>
    <section class="toolbar"><input id="search" type="search" placeholder="Search requests…"><select id="statusFilter"><option value="">All statuses</option><option value="new">New</option><option value="in_progress">In progress</option><option value="completed">Completed</option><option value="closed">Closed</option></select><select id="typeFilter"><option value="">All types</option><option value="bug">Bugs</option><option value="request">Requests</option></select><select id="priorityFilter"><option value="">All priorities</option><option value="urgent">Urgent</option><option value="high">High</option><option value="normal">Normal</option><option value="low">Low</option></select></section>
    <section class="list" id="list"><div class="empty">Loading requests…</div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const URL='https://glonbvrcudwuzjundrii.supabase.co',KEY='sb_publishable_VZbed_uuOXSE744UrAfHXw_z2xDdYtr';
    let db=null,rows=[];
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const label=value=>String(value||'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());
    const date=value=>value?new Date(value).toLocaleString([], {dateStyle:'medium',timeStyle:'short'}):'Unknown date';
    async function getDb(){if(db)return db;if(window.parent!==window){for(let attempt=0;attempt<100;attempt++){try{if(window.parent.supabaseClient){db=window.parent.supabaseClient;return db}}catch{}await new Promise(resolve=>setTimeout(resolve,50))}}db=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true},global:{fetch:(url,options)=>Promise.race([fetch(url,options),new Promise((_,reject)=>setTimeout(()=>reject(new Error('The request timed out.')),12000))])}});return db}
    async function load(){const list=document.querySelector('#list');list.innerHTML='<div class="empty">Loading requests…</div>';try{const client=await getDb(),{data,error}=await client.from('website_requests').select('*').order('created_at',{ascending:false});if(error)throw error;rows=data||[];render()}catch(error){list.innerHTML=`<div class="error"><strong>Could not load requests.</strong><br>${esc(error?.message||'Please refresh and try again.')}</div>`}}
    function render(){document.querySelector('#total').textContent=rows.length;document.querySelector('#newCount').textContent=rows.filter(r=>r.status==='new').length;document.querySelector('#progressCount').textContent=rows.filter(r=>r.status==='in_progress').length;document.querySelector('#doneCount').textContent=rows.filter(r=>r.status==='completed').length;const query=document.querySelector('#search').value.trim().toLowerCase(),status=document.querySelector('#statusFilter').value,type=document.querySelector('#typeFilter').value,priority=document.querySelector('#priorityFilter').value,shown=rows.filter(r=>(!status||r.status===status)&&(!type||r.request_type===type)&&(!priority||r.priority===priority)&&(!query||[r.subject,r.details,r.source_site,r.submitted_by,r.page].join(' ').toLowerCase().includes(query)));document.querySelector('#list').innerHTML=shown.length?shown.map(card).join(''):'<div class="empty card">No requests match these filters.</div>';bind()}
    function card(r){return `<article class="request card"><div class="request-top"><div class="tags"><span class="tag ${esc(r.request_type)}">${esc(label(r.request_type))}</span><span class="tag ${esc(r.priority)}">${esc(label(r.priority))}</span><span class="tag">${esc(label(r.status))}</span></div><div class="actions"><select data-status="${esc(r.id)}" aria-label="Request status"><option value="new" ${r.status==='new'?'selected':''}>New</option><option value="in_progress" ${r.status==='in_progress'?'selected':''}>In progress</option><option value="completed" ${r.status==='completed'?'selected':''}>Completed</option><option value="closed" ${r.status==='closed'?'selected':''}>Closed</option></select><button class="delete" data-delete="${esc(r.id)}" title="Delete request" aria-label="Delete request"><i class="bi bi-trash3"></i></button></div></div><h2>${esc(r.subject)}</h2><p>${esc(r.details)}</p><div class="meta"><span><i class="bi bi-building"></i> ${esc(r.source_site||'Website')}</span><span><i class="bi bi-window"></i> ${esc(r.page||'Other')}</span><span><i class="bi bi-person"></i> ${esc(r.submitted_by||'Unknown')}</span><span><i class="bi bi-clock"></i> ${esc(date(r.created_at))}</span></div></article>`}
    function bind(){document.querySelectorAll('[data-status]').forEach(input=>input.onchange=async()=>{input.disabled=true;const {error}=await db.from('website_requests').update({status:input.value}).eq('id',input.dataset.status);input.disabled=false;if(error)alert(error.message);else load()});document.querySelectorAll('[data-delete]').forEach(button=>button.onclick=async()=>{if(!confirm('Delete this request permanently?'))return;button.disabled=true;const {error}=await db.from('website_requests').delete().eq('id',button.dataset.delete);if(error)alert(error.message);else load()})}
    ['search','statusFilter','typeFilter','priorityFilter'].forEach(id=>document.querySelector('#'+id).addEventListener(id==='search'?'input':'change',render));document.querySelector('#refresh').onclick=load;load();
  </script>
</body>
</html>
