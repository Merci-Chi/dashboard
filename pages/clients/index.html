<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Clients</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="clients.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div>
        <span class="kicker">KIARA ACCESS</span>
        <h1>Clients</h1>
        <p class="subtitle">Manage agreements, the $100 development payment, hosting plans, and client details.</p>
      </div>
      <button class="btn secondary page-unlock-btn" id="unlockClientsPage" type="button" aria-pressed="false">
        <i class="bi bi-lock-fill"></i> Unlock clients
      </button>
    </header>

    <section class="toolbar card">
      <div class="toolbar-row">
        <div class="filter-pills" id="filterPills"></div>
        <label class="search-box">
          <i class="bi bi-search"></i>
          <input id="searchInput" type="search" placeholder="Search clients..." autocomplete="off">
        </label>
      </div>
      <div class="toolbar-row toolbar-subrow">
        <div class="selection-summary" id="selectionSummary">No clients selected.</div>
        <div class="selection-actions">
          <button class="btn secondary" id="clearSelectionButton" type="button">Clear selection</button>
        </div>
      </div>
    </section>

    <div class="status" id="status"></div>

    <section class="board card">
      <div class="table-scroll">
        <table class="client-table">
          <thead>
            <tr>
              <th class="check-col"><input id="selectAllRows" type="checkbox" aria-label="Select all visible clients"></th>
              <th>Client</th>
              <th>Email</th>
              <th>Agreement</th>
              <th>$100 Dev</th>
              <th>Standard</th>
              <th>Backend</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>

    <section class="details-wrap" id="detailsWrap"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="clients.js"></script>
</body>
</html>
