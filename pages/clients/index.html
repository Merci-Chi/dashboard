<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Clients</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="clients.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div>
        <span class="kicker">KIARA ACCESS</span>
        <h1>Clients</h1>
        <p class="subtitle">Manage live sites, requests, subscriptions, obligations, and agreements.</p>
      </div>
      <button class="btn secondary page-unlock-btn" id="unlockClientsPage" type="button" aria-pressed="false">
        <i class="bi bi-lock-fill"></i> Unlock clients
      </button>
    </header>

    <div class="status" id="status"></div>

    <nav class="client-filters" id="clientFilters" aria-label="Filter clients by progress">
      <button class="filter-btn active" type="button" data-filter="all">All <span class="filter-count">0</span></button>
      <button class="filter-btn" type="button" data-filter="agreement">Agreement <span class="filter-count">0</span></button>
      <button class="filter-btn" type="button" data-filter="development">$100 Development <span class="filter-count">0</span></button>
      <button class="filter-btn" type="button" data-filter="standard">Standard Hosting <span class="filter-count">0</span></button>
      <button class="filter-btn" type="button" data-filter="backend">Backend Hosting <span class="filter-count">0</span></button>
    </nav>

    <section class="cards" id="clientList"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="clients.js"></script>
</body>
</html>
