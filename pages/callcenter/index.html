<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CallCenter Management</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="callcenter.css?v=20261001-2" />
</head>
<body>
  <main class="cc-page">
    <header class="cc-header">
      <div>
        <span class="eyebrow">ADMINISTRATION</span>
        <h1>CallCenter</h1>
        <p>Manage users, referrals, earnings, account status, and call activity.</p>
      </div>
      <button class="button secondary" id="refreshButton" type="button">
        <i class="bi bi-arrow-clockwise"></i> Refresh
      </button>
    </header>

    <section class="summary-grid">
      <article class="summary-card"><span>Total Users</span><strong id="totalUsers">—</strong></article>
      <article class="summary-card"><span>Active</span><strong id="activeUsers">—</strong></article>
      <article class="summary-card"><span>Pending Earnings</span><strong id="pendingEarnings">—</strong></article>
      <article class="summary-card"><span>Pending Bonuses</span><strong id="pendingBonuses">—</strong></article>
    </section>

    <nav class="tabs" aria-label="CallCenter sections">
      <button class="tab active" data-tab="users"><i class="bi bi-people-fill"></i> Users</button>
      <button class="tab" data-tab="earnings"><i class="bi bi-cash-coin"></i> Earnings</button>
      <button class="tab" data-tab="referrals"><i class="bi bi-diagram-3-fill"></i> Referrals</button>
      <button class="tab" data-tab="activity"><i class="bi bi-clock-history"></i> Activity</button>
    </nav>

    <section class="toolbar">
      <label class="search-box">
        <i class="bi bi-search"></i>
        <input id="searchInput" type="search" placeholder="Search users, emails, clients, outcomes…" />
      </label>
      <select id="statusFilter">
        <option value="all">All activity statuses</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
        <option value="disabled">Disabled / 90+ days</option>
      </select>
    </section>

    <div class="page-status" id="pageStatus" role="status">Loading CallCenter…</div>

    <section class="panel active" id="panelUsers"></section>
    <section class="panel" id="panelEarnings"></section>
    <section class="panel" id="panelReferrals"></section>
    <section class="panel" id="panelActivity"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="callcenter.js?v=20261001-7"></script>
</body>
</html>
