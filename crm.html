<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#01050b">
<title>CRM | Steady Hands Operations</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#01050b;--panel:#06182b;--panel2:#041323;--line:#1267ae;--soft:#153e65;--text:#f4f8ff;--muted:#8eb4dc;--blue:#238cff;--cyan:#73bdff;--green:#1ed886;--red:#ff5268;--orange:#ff9d51;--purple:#aa64ff}
*{box-sizing:border-box}html{min-width:320px;background:var(--bg)}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#020914,#01050b 72%);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.main{width:100%;max-width:1450px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.title span{color:var(--cyan);font-size:11px;font-weight:900;letter-spacing:.16em}.title h1{margin:3px 0 0;font-size:30px}.btn{min-height:42px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#08213c;color:#fff;font-weight:800}.btn i{margin-right:7px}.btn.primary{border-color:var(--blue);background:#0b75df}.btn.danger{border-color:#ff5268;background:#451822;color:#ffb1ba}.btn.danger:hover{background:#652432;color:#fff}.card{border:1px solid var(--line);border-radius:14px;background:#041323}.directory-panel{padding:17px}.directory-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:14px}.directory-head h2{margin:0;font-size:21px}.directory-head p{margin:3px 0 0;color:var(--muted)}.directory-search{display:flex;align-items:center;gap:9px;width:min(420px,100%);min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#03101e;color:var(--muted)}.directory-search input{width:100%;border:0;outline:0;background:transparent;color:#fff}.category-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:11px}.category-button,.site-filter-button{min-height:44px;border:1px solid var(--soft);border-radius:10px;background:#061a30;color:var(--cyan);font-weight:800}.category-button.active,.site-filter-button.active{border-color:var(--cyan);background:#0b3155;color:#fff}.category-count{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:#ffffff15;margin-left:6px;font-size:12px}.site-filter-tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}.directory-status{min-height:20px;margin:2px 2px 10px;color:var(--muted);font-size:13px}.lead-list{display:grid;gap:8px}.lead-choice{display:grid;grid-template-columns:42px minmax(0,1fr) auto 16px;gap:11px;align-items:center;width:100%;padding:12px 14px;border:1px solid var(--soft);border-radius:11px;background:#041425;color:var(--text);text-align:left}.lead-choice:hover{border-color:var(--cyan);background:#07203a}.choice-icon{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:9px;background:#08213c;color:var(--cyan)}.choice-main{min-width:0}.choice-main strong,.choice-main span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.choice-main strong{font-size:15px}.choice-main span{margin-top:2px;color:var(--muted);font-size:12px}.site-preview-state{display:inline-block!important;width:max-content;margin-top:5px!important;padding:3px 8px;border:1px solid #1ed88666;border-radius:999px;background:#1ed88612;color:#67eaaa!important;font-size:10px!important;font-weight:850}.site-preview-state.missing{border-color:#ff9d5166;background:#ff9d5112;color:#ffc096!important}.choice-status{padding:5px 9px;border-radius:999px;font-size:10px;font-weight:900;text-transform:uppercase}.status-uncalled{background:#0d355d;color:#86c7ff}.status-followups{background:#473314;color:#ffd072}.status-notinterested{background:#491d29;color:#ff8c9b}.choice-chevron{color:var(--muted)}.directory-empty{padding:36px 16px;border:1px dashed var(--soft);border-radius:11px;color:var(--muted);text-align:center}
.detail-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}.back-button{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:#071d35;color:var(--cyan);font-size:18px}.identity{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 17px}.identity-main{min-width:0}.identity h2{margin:0;font-size:25px}.identity p{margin:4px 0 0;color:var(--cyan);font-weight:700}.identity-actions{display:flex;gap:8px;flex-wrap:wrap}.editor{display:grid;gap:12px;margin-top:12px}.section{padding:15px}.section h3{margin:0 0 12px;font-size:17px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field.full{grid-column:1/-1}.field label{display:block;margin-bottom:4px;color:var(--muted);font-size:11px;font-weight:850}.field input,.field select,.field textarea{width:100%;border:1px solid var(--soft);border-radius:9px;background:#03101e;color:#fff;outline:0}.field input,.field select{height:41px;padding:0 10px}.field textarea{min-height:82px;padding:10px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--cyan)}.tag-area{display:grid;gap:9px}.tag-buttons{display:flex;gap:7px;flex-wrap:wrap;min-height:34px}.tag-btn{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 11px;border:1px solid var(--blue);border-radius:9px;background:#08213c;color:#dcecff;font-weight:750}.tag-btn:hover{border-color:var(--red);color:#ffb1ba}.tag-btn i{font-size:12px}.tag-add{display:flex;gap:8px}.tag-add input{flex:1;min-width:0;height:40px;padding:0 10px;border:1px solid var(--soft);border-radius:9px;background:#03101e;color:#fff}.preview-actions{display:flex;gap:8px;flex-wrap:wrap}.preview-actions a{display:inline-flex;align-items:center;min-height:38px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:#08213c;color:#dcecff;text-decoration:none}.savebar{position:sticky;bottom:10px;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#041323ee;backdrop-filter:blur(10px)}.save-status{color:var(--muted);font-size:12px}.toast{position:fixed;right:18px;bottom:18px;z-index:100;padding:10px 14px;border:1px solid var(--blue);border-radius:9px;background:#08213c;opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}[hidden]{display:none!important}
@media(max-width:760px){.main{padding:13px}.top,.directory-head,.identity{align-items:stretch;flex-direction:column}.category-tabs,.site-filter-tabs,.fields{grid-template-columns:1fr}.directory-search{width:100%}.lead-choice{grid-template-columns:38px minmax(0,1fr)}.choice-status,.choice-chevron{grid-column:2;justify-self:start}.identity-actions{width:100%}.identity-actions .btn{flex:1}.savebar{align-items:stretch;flex-direction:column}.savebar .btn{width:100%}}
</style>
</head>
<body>
<main class="main">
<header class="top"><div class="title"><span>SALES PIPELINE</span><h1 id="pageTitle">Select a Lead</h1></div><button class="btn" id="refreshLeads" type="button"><i class="bi bi-arrow-clockwise"></i>Refresh</button></header>
<section id="directoryView">
  <section class="card directory-panel">
    <div class="directory-head"><div><h2>Outreach Leads</h2><p>Choose a category, then select a lead to open the CRM record.</p></div><label class="directory-search"><i class="bi bi-search"></i><input id="directorySearch" type="search" placeholder="Search leads…" autocomplete="off"></label></div>
    <div class="category-tabs"><button class="category-button active" type="button" data-category="uncalled">Leads Not Called <span class="category-count" data-count="uncalled">0</span></button><button class="category-button" type="button" data-category="followups">Follow Ups <span class="category-count" data-count="followups">0</span></button><button class="category-button" type="button" data-category="notinterested">Not Interested <span class="category-count" data-count="notinterested">0</span></button></div>
    <div class="site-filter-tabs"><button class="site-filter-button active" type="button" data-site-filter="has-site"><i class="bi bi-link-45deg"></i> Has Site Preview</button><button class="site-filter-button" type="button" data-site-filter="no-site"><i class="bi bi-link-45deg"></i> Does Not Have Site Preview</button></div>
    <div class="directory-status" id="directoryStatus">Loading leads…</div><div class="lead-list" id="leadList"></div>
  </section>
</section>
<section id="detailView" hidden>
  <div class="detail-top"><button class="back-button" id="backButton" type="button"><i class="bi bi-arrow-left"></i></button><div class="title"><span>CRM RECORD</span><h1>Edit Lead</h1></div></div>
  <section class="card identity"><div class="identity-main"><h2 id="detailCompany">Company</h2><p id="detailContact">Owner · Phone</p></div><div class="identity-actions"><button class="btn danger" id="deleteLead" type="button"><i class="bi bi-trash3-fill"></i>Delete</button></div></section>
  <div class="editor">
    <section class="card section"><h3>Contact</h3><div class="fields"><div class="field"><label>Company</label><input data-field="company"></div><div class="field"><label>Owner / Contact</label><input data-field="name"></div><div class="field"><label>Phone</label><input data-field="phone"></div><div class="field"><label>Alt Phone</label><input data-field="altphone"></div><div class="field"><label>Email</label><input data-field="email" type="email"></div><div class="field"><label>Website</label><input data-field="website"></div></div></section>
    <section class="card section"><h3>Website</h3><div class="fields"><div class="field"><label>Site Key</label><input data-field="sitekey"></div><div class="field"><label>Preview URL</label><input data-field="previewurl"></div><div class="field"><label>Live URL</label><input data-field="liveurl"></div><div class="field"><label>Domain</label><input data-field="domain"></div></div><div class="preview-actions" id="previewActions" style="margin-top:10px"></div></section>
    <section class="card section"><h3>Status</h3><div class="fields"><div class="field"><label>Stage</label><select data-field="stage"><option value="notstarted">Not Started</option><option value="staging">Staging</option><option value="outreach">Outreach</option><option value="review">Review</option><option value="complete">Complete</option><option value="notinterested">Not Interested</option><option value="archived">Archived</option></select></div><div class="field"><label>Relationship</label><select data-field="relationship"><option value="prospect">Prospect</option><option value="client">Client</option><option value="formerclient">Former Client</option></select></div><div class="field"><label>Outcome</label><input data-field="outcome"></div><div class="field"><label>Assigned</label><input data-field="assigned"></div><div class="field"><label>Callback Date</label><input data-field="callbackdate" type="date"></div><div class="field"><label>Callback Time</label><input data-field="callbacktime" type="time"></div></div></section>
    <section class="card section"><h3>Tags</h3><div class="tag-area"><div class="tag-buttons" id="tagButtons"></div><div class="tag-add"><input id="tagInput" placeholder="Add tag"><button class="btn" id="addTag" type="button">Add</button></div></div></section>
    <section class="card section"><h3>Sources</h3><div class="tag-area"><div class="tag-buttons" id="sourceButtons"></div><div class="tag-add"><input id="sourceInput" placeholder="Add source"><button class="btn" id="addSource" type="button">Add</button></div></div></section>
    <section class="card section"><h3>Notes</h3><div class="fields"><div class="field full"><label>Main Issue</label><textarea data-field="issue"></textarea></div><div class="field full"><label>Concerns</label><textarea data-field="concerns"></textarea></div><div class="field full"><label>Notes</label><textarea data-field="notes"></textarea></div></div></section>
    <div class="savebar"><span class="save-status" id="saveStatus">Changes are saved only when you click Save.</span><button class="btn primary" id="saveLead" type="button"><i class="bi bi-check2-circle"></i>Save Changes</button></div>
  </div>
</section>
</main>
<div class="toast" id="toast"></div>
<script>
const SUPABASE_URL='https://glonbvrcudwuzjundrii.supabase.co';
const SUPABASE_KEY='sb_publishable_VZbed_uuOXSE744UrAfHXw_z2xDdYtr';
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let leads=[],active=null,directoryCategory='uncalled',siteFilterMode='has-site',tags=[],sources=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=(v,f='')=>String(v??'').trim()||f;
const normalize=v=>String(v||'').trim().toLowerCase().replace(/[\s_-]+/g,'');
function hasPreview(l){return l?.has_site_preview===true||Boolean(clean(l?.previewurl)||clean(l?.sitekey))}
function leadTags(l){return [...(Array.isArray(l?.tags)?l.tags:[]),...(Array.isArray(l?.sources)?l.sources:[])]}
function isNotInterested(l){return [...leadTags(l),l?.stage,l?.outcome].some(v=>normalize(v)==='notinterested')}
function leadCategory(l){if(isNotInterested(l))return'notinterested';return l?.lastcalled?'followups':'uncalled'}
function categoryLabel(c){return c==='notinterested'?'Not Interested':c==='followups'?'Follow Up':'Not Called'}
function lastCalledLabel(l){if(!l?.lastcalled)return clean(l?.phone,'No phone number');const d=new Date(l.lastcalled);return Number.isNaN(d.getTime())?'Previously called':'Last called '+d.toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
function renderDirectory(){const counts={uncalled:0,followups:0,notinterested:0};leads.forEach(l=>counts[leadCategory(l)]++);Object.entries(counts).forEach(([k,v])=>{const n=document.querySelector('[data-count="'+k+'"]');if(n)n.textContent=v});const needle=clean($('#directorySearch').value).toLowerCase();const matches=leads.filter(l=>leadCategory(l)===directoryCategory&&hasPreview(l)===(siteFilterMode==='has-site')&&(!needle||[l.company,l.name,l.phone,l.email,l.leadtype,...leadTags(l)].some(v=>String(v||'').toLowerCase().includes(needle))));$('#directoryStatus').textContent=`${matches.length} ${matches.length===1?'lead':'leads'} in ${directoryCategory==='uncalled'?'Leads Not Called':directoryCategory==='followups'?'Follow Ups':'Not Interested'} · ${siteFilterMode==='has-site'?'Has Site Preview':'Does Not Have Site Preview'}`;$('#leadList').innerHTML=matches.length?matches.map(l=>{const c=leadCategory(l),hp=hasPreview(l),sub=c==='notinterested'?'Marked Not Interested':lastCalledLabel(l);return `<button class="lead-choice" type="button" data-lead-id="${esc(l.id)}"><span class="choice-icon"><i class="bi bi-building"></i></span><span class="choice-main"><strong>${esc(clean(l.company,'Unnamed business'))}</strong><span>${esc(clean(l.name,'No contact name'))} · ${esc(sub)}</span><span class="site-preview-state${hp?'':' missing'}">${hp?'Has site preview':'Does not have site preview'}</span></span><span class="choice-status status-${c}">${categoryLabel(c)}</span><i class="bi bi-chevron-right choice-chevron"></i></button>`}).join(''):'<div class="directory-empty">No leads in this view.</div>'}
async function load(){const {data,error}=await client.from('crm').select('*').order('company',{ascending:true});if(error)throw error;leads=data||[];renderDirectory()}
function showDirectory(){active=null;$('#detailView').hidden=true;$('#directoryView').hidden=false;$('#pageTitle').textContent='Select a Lead';renderDirectory()}
function formatPhone(v){return clean(v,'No phone number')}
function showDetail(id){active=leads.find(l=>String(l.id)===String(id));if(!active)return;$('#directoryView').hidden=true;$('#detailView').hidden=false;$('#pageTitle').textContent='CRM';$('#detailCompany').textContent=clean(active.company,'Unnamed business');$('#detailContact').textContent=`${clean(active.name,'No contact name')} · ${formatPhone(active.phone)}`;$$('[data-field]').forEach(el=>{const key=el.dataset.field;el.value=active[key]??''});tags=Array.isArray(active.tags)?[...active.tags]:[];sources=Array.isArray(active.sources)?[...active.sources]:[];renderPills();renderPreviewActions()}
function renderPills(){$('#tagButtons').innerHTML=tags.length?tags.map((t,i)=>`<button class="tag-btn" type="button" data-remove-tag="${i}">${esc(t)} <i class="bi bi-x-lg"></i></button>`).join(''):'<span style="color:var(--muted);font-size:12px">No tags yet.</span>';$('#sourceButtons').innerHTML=sources.length?sources.map((t,i)=>`<button class="tag-btn" type="button" data-remove-source="${i}">${esc(t)} <i class="bi bi-x-lg"></i></button>`).join(''):'<span style="color:var(--muted);font-size:12px">No sources yet.</span>'}
function renderPreviewActions(){const items=[];const preview=clean(active.previewurl)||(clean(active.sitekey)?`https://viewyoursite.today/Sites/${encodeURIComponent(active.sitekey)}/`:'');if(preview)items.push(`<a href="${esc(preview)}" target="_blank"><i class="bi bi-box-arrow-up-right"></i>&nbsp;Preview</a>`);if(clean(active.liveurl))items.push(`<a href="${esc(active.liveurl)}" target="_blank"><i class="bi bi-globe"></i>&nbsp;Live Site</a>`);$('#previewActions').innerHTML=items.join('')}
function addPill(kind){const input=$(kind==='tag'?'#tagInput':'#sourceInput'),value=clean(input.value);if(!value)return;const list=kind==='tag'?tags:sources;if(!list.some(x=>String(x).toLowerCase()===value.toLowerCase()))list.push(value);input.value='';renderPills()}
async function saveLead(){if(!active)return;const patch={};$$('[data-field]').forEach(el=>patch[el.dataset.field]=el.value);patch.tags=tags;patch.sources=sources;patch.updated=new Date().toISOString();const b=$('#saveLead');b.disabled=true;$('#saveStatus').textContent='Saving…';const {error}=await client.from('crm').update(patch).eq('id',active.id);b.disabled=false;if(error){$('#saveStatus').textContent='Could not save.';toast(error.message);return}Object.assign(active,patch);$('#detailCompany').textContent=clean(active.company,'Unnamed business');$('#detailContact').textContent=`${clean(active.name,'No contact name')} · ${formatPhone(active.phone)}`;$('#saveStatus').textContent='Saved.';renderDirectory();renderPreviewActions();toast('CRM record saved')}
async function deleteLead(){if(!active)return;const label=clean(active.company,'this lead');if(!confirm(`Delete ${label}? This permanently removes this CRM record.`))return;const b=$('#deleteLead');b.disabled=true;const {error}=await client.from('crm').delete().eq('id',active.id);b.disabled=false;if(error){toast(error.message||'Could not delete lead');return}leads=leads.filter(l=>l.id!==active.id);toast('Lead deleted');showDirectory()}
$('#leadList').onclick=e=>{const b=e.target.closest('[data-lead-id]');if(b)showDetail(b.dataset.leadId)};
$('#backButton').onclick=showDirectory;$('#saveLead').onclick=saveLead;$('#deleteLead').onclick=deleteLead;$('#refreshLeads').onclick=async()=>{try{await load();toast('Leads refreshed')}catch(e){toast(e.message||'Could not refresh')}};$('#directorySearch').oninput=renderDirectory;
$('.category-tabs').onclick=e=>{const b=e.target.closest('[data-category]');if(!b)return;directoryCategory=b.dataset.category;$$('[data-category]').forEach(x=>x.classList.toggle('active',x===b));renderDirectory()};
$('.site-filter-tabs').onclick=e=>{const b=e.target.closest('[data-site-filter]');if(!b)return;siteFilterMode=b.dataset.siteFilter;$$('[data-site-filter]').forEach(x=>x.classList.toggle('active',x===b));renderDirectory()};
$('#addTag').onclick=()=>addPill('tag');$('#addSource').onclick=()=>addPill('source');$('#tagInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addPill('tag')}};$('#sourceInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addPill('source')}};
$('#tagButtons').onclick=e=>{const b=e.target.closest('[data-remove-tag]');if(!b)return;tags.splice(Number(b.dataset.removeTag),1);renderPills()};$('#sourceButtons').onclick=e=>{const b=e.target.closest('[data-remove-source]');if(!b)return;sources.splice(Number(b.dataset.removeSource),1);renderPills()};
load().catch(e=>{$('#directoryStatus').textContent=e.message||'Could not load leads'});
</script>
<script src="outreach-notes-alerts.js?v=crm-20260915-1"></script>
</body>
</html>
