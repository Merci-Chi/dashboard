<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Live</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" href="pipeline.css"></head><body><main class="wrap"><header class="top"><div><span class="kicker">VIEWYOURSITE</span><h1>Live Sites</h1><p class="subtitle">Verified sites ready to move forward to Contact.</p></div></header><div class="status" id="status"></div><section class="cards" id="live"></section></main><script src="pipeline.js"></script><script>(()=>{const root=document.getElementById('live'),status=document.getElementById('status');async function load(){try{const sites=await SitePipeline.list(['live']);root.innerHTML=sites.map(x=>`<article class="card live-card"><div class="live-preview"><i class="bi bi-window-fullscreen"></i><span>Verified website</span></div><div class="live-details"><div><span class="badge good">Live</span><h2>${SitePipeline.escapeHTML(x.company)}</h2><p>${SitePipeline.escapeHTML(x.slug)}</p></div><div class="review-actions"><button class="btn secondary" data-back="${x.id}">Back to Review</button><button class="btn" data-next="${x.id}">Send to Contact</button></div></div></article>`).join('')||'<div class="empty"><div><i class="bi bi-broadcast"></i><strong>No live sites.</strong></div></div>'}catch(e){status.textContent=e.message}}root.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.back)await SitePipeline.update(b.dataset.back,{status:'review'});if(b.dataset.next)await SitePipeline.update(b.dataset.next,{status:'contact'});load()});load()})();</script></body></html>
