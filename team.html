<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Team Management</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="team.css" />
</head>
<body>
  <main class="team-page">
    <header class="team-header">
      <div>
        <span class="eyebrow">ACCOUNT &amp; ACCESS</span>
        <h1>Team</h1>
        <p>Create staff accounts and choose exactly which dashboard pages each person can use.</p>
      </div>
      <button class="primary-button" id="showCreateButton" type="button">
        <i class="bi bi-person-plus-fill" aria-hidden="true"></i>
        New team member
      </button>
    </header>

    <section class="create-panel" id="createPanel" hidden aria-labelledby="createTitle">
      <div class="panel-heading">
        <div>
          <span class="eyebrow">NEW ACCOUNT</span>
          <h2 id="createTitle">Add a team member</h2>
        </div>
        <button class="icon-button" id="hideCreateButton" type="button" aria-label="Close new member form">
          <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
      </div>

      <form id="createForm">
        <div class="form-grid">
          <label>
            <span>First name</span>
            <input id="firstName" type="text" maxlength="40" autocomplete="off" placeholder="Jaden" required />
          </label>
          <label>
            <span>Display name</span>
            <input id="displayName" type="text" maxlength="60" autocomplete="off" placeholder="Jaden Norwood" required />
          </label>
          <label>
            <span>Role</span>
            <select id="newRole">
              <option value="SALES">SALES</option>
              <option value="BUILDING">BUILDING</option>
              <option value="MOD">MOD</option>
              <option value="ADMIN">ADMIN</option>
            </select>
          </label>
        </div>

        <div class="account-preview">
          <i class="bi bi-envelope-fill" aria-hidden="true"></i>
          <div><span>Email</span><strong id="emailPreview">firstname@steadyhandsop.com</strong></div>
          <div><span>Temporary password</span><strong>password</strong></div>
        </div>

        <fieldset>
          <legend>Page access</legend>
          <div class="permission-grid" id="newPermissions"></div>
        </fieldset>

        <div class="form-actions">
          <span class="form-status" id="createStatus" role="status"></span>
          <button class="primary-button" id="createButton" type="submit">Create account</button>
        </div>
      </form>
    </section>

    <section class="team-toolbar" aria-label="Team tools">
      <label class="search-box">
        <i class="bi bi-search" aria-hidden="true"></i>
        <input id="teamSearch" type="search" placeholder="Search team" />
      </label>
      <button class="secondary-button" id="refreshButton" type="button">
        <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
        Refresh
      </button>
    </section>

    <div class="page-status" id="pageStatus" role="status">Loading team…</div>
    <section class="team-list" id="teamList" aria-live="polite"></section>
  </main>

  <template id="memberTemplate">
    <article class="member-card">
      <button class="member-summary" type="button" aria-expanded="false" aria-label="Edit team member access">
        <span class="member-avatar" aria-hidden="true"></span>
        <span class="member-identity">
          <strong class="member-name"></strong>
          <span class="member-email"></span>
        </span>
        <span class="status-pill"></span>
        <span class="role-pill"></span>
        <i class="bi bi-chevron-down member-chevron" aria-hidden="true"></i>
      </button>
      <div class="member-editor" hidden>
        <div class="editor-row">
          <label>
            <span>Role</span>
            <select class="member-role">
              <option value="SALES">SALES</option>
              <option value="BUILDING">BUILDING</option>
              <option value="MOD">MOD</option>
              <option value="ADMIN">ADMIN</option>
            </select>
          </label>
          <label class="active-toggle">
            <input class="member-active" type="checkbox" />
            <span><strong>Account active</strong><small>Turn off to remove dashboard access.</small></span>
          </label>
        </div>
        <fieldset>
          <legend>Page access</legend>
          <div class="permission-grid member-permissions"></div>
        </fieldset>
        <div class="editor-actions">
          <span class="member-status" role="status"></span>
          <button class="save-button" type="button">Save access</button>
        </div>
      </div>
    </article>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="team.js"></script>
</body>
</html>
