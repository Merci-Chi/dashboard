name: Inject CRM Outreach easy controls
on:
  workflow_dispatch:
  push:
    paths:
      - 'crm-easy-controls.js'
      - 'outreach-followup.js'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch pages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          crm=Path('crm.html')
          text=crm.read_text()
          tag='<script src="crm-easy-controls.js?v=20260915-1"></script>'
          if tag not in text:
              text=text.replace('</body>', tag+'\n</body>')
          crm.write_text(text)

          outreach=Path('outreach.html')
          text=outreach.read_text()
          tag='<script src="outreach-followup.js?v=20260915-1"></script>'
          if tag not in text:
              text=text.replace('</body>', tag+'\n</body>')
          outreach.write_text(text)

          idx=Path('index.html')
          text=idx.read_text()
          import re
          text=re.sub(r'crm\.html\?v=[^"\']+', 'crm.html?v=easy-controls-20260915-2', text)
          text=re.sub(r'outreach\.html\?v=[^"\']+', 'outreach.html?v=followup-calendar-20260915-2', text)
          idx.write_text(text)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crm.html outreach.html index.html
          git diff --cached --quiet || git commit -m "Wire easier CRM and follow-up scheduling"
          git push
