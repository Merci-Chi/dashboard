name: Patch Outreach admin preview

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-outreach-admin-preview.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch outreach admin preview
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('outreach.html')
          s = p.read_text()

          old = """    function hasOutreachPreview(lead){return lead?.has_site_preview===true}\n    function outreachPreviewUrl(lead){const folder=String(lead?.sitekey||'').trim();return hasOutreachPreview(lead)&&folder?'https://viewyoursite.today/Sites/'+encodeURIComponent(folder)+'/':''}"""
          new = """    function hasOutreachPreview(lead){return lead?.has_site_preview===true||Boolean(String(lead?.previewurl||lead?.adminurl||'').trim())}\n    function outreachPreviewUrl(lead){const direct=String(lead?.previewurl||'').trim();if(direct)return direct.endsWith('/')?direct:direct+'/';const folder=String(lead?.sitekey||'').trim();return hasOutreachPreview(lead)&&folder?'https://viewyoursite.today/Sites/'+encodeURIComponent(folder)+'/':''}"""
          if old not in s:
              raise SystemExit('preview helper block not found')
          s = s.replace(old, new, 1)

          old = """    function hasAdminSite(lead){\n      const tier=String(lead?.tier||'').toLowerCase();\n      const tags=[...(Array.isArray(lead?.tags)?lead.tags:[]),...(Array.isArray(lead?.sources)?lead.sources:[])].join(' ').toLowerCase();\n      return tier.includes('30')||tier.includes('admin')||tier.includes('backend')||tags.includes('admin ready')||tags.includes('admin site');\n    }"""
          new = """    function hasAdminSite(lead){\n      if(String(lead?.adminurl||'').trim())return true;\n      if(String(lead?.adminstatus||'').trim().toLowerCase()==='valid')return true;\n      const tier=String(lead?.tier||'').toLowerCase();\n      const tags=[...(Array.isArray(lead?.tags)?lead.tags:[]),...(Array.isArray(lead?.sources)?lead.sources:[])].join(' ').toLowerCase();\n      return tier.includes('30')||tier.includes('admin')||tier.includes('backend')||tags.includes('admin ready')||tags.includes('admin site');\n    }\n    function outreachAdminUrl(lead){const direct=String(lead?.adminurl||'').trim();if(direct)return direct.endsWith('/')?direct:direct+'/';const site=outreachPreviewUrl(lead);return site&&hasAdminSite(lead)?site+'admin/':''}"""
          if old not in s:
              raise SystemExit('admin helper block not found')
          s = s.replace(old, new, 1)

          old = """      const adminReady=Boolean(siteUrl)&&hasAdminSite(active);\n      $('#adminUrl').textContent=adminReady?siteUrl+'admin':'Admin site currently unavailable';\n      $('#copyAdmin').hidden=!adminReady;\n      $('#copyAdmin').disabled=!adminReady;"""
          new = """      const adminPreview=outreachAdminUrl(active);\n      const adminReady=Boolean(adminPreview);\n      $('#adminUrl').textContent=adminReady?adminPreview:'Admin site currently unavailable';\n      $('#copyAdmin').hidden=!adminReady;\n      $('#copyAdmin').disabled=!adminReady;"""
          if old not in s:
              raise SystemExit('admin render block not found')
          s = s.replace(old, new, 1)

          old = """    async function load(){client=await getClient();const crmResult=await client.from('crm').select('*').order('businessrank',{ascending:true,nullsFirst:false}).order('company',{ascending:true});if(crmResult.error)throw crmResult.error;leads=crmResult.data||[];if(!restorePendingCall())showDirectory()}"""
          new = """    async function load(){\n      client=await getClient();\n      const [crmResult,siteResult]=await Promise.all([\n        client.from('crm').select('*').order('businessrank',{ascending:true,nullsFirst:false}).order('company',{ascending:true}),\n        client.from('sites').select('id,crmid,sitekey,previewurl,adminurl,adminstatus')\n      ]);\n      if(crmResult.error)throw crmResult.error;\n      if(siteResult.error)console.warn('Could not load site/admin preview links',siteResult.error);\n      const sites=siteResult.data||[],byCrm=new Map(),byKey=new Map();\n      sites.forEach(site=>{if(site.crmid)byCrm.set(String(site.crmid),site);if(site.sitekey)byKey.set(String(site.sitekey).trim().toLowerCase(),site)});\n      leads=(crmResult.data||[]).map(lead=>{const key=String(lead.sitekey||'').trim().toLowerCase(),site=byCrm.get(String(lead.id))||(key?byKey.get(key):null);return site?{...lead,sitekey:site.sitekey||lead.sitekey,previewurl:site.previewurl||lead.previewurl||'',adminurl:site.adminurl||lead.adminurl||'',adminstatus:site.adminstatus||lead.adminstatus||''}:lead});\n      if(!restorePendingCall())showDirectory();\n    }"""
          if old not in s:
              raise SystemExit('load block not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outreach.html
          git diff --cached --quiet && exit 0
          git commit -m "Show real admin previews in Outreach [skip ci]"
          git push
