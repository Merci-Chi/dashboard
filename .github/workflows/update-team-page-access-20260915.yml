name: Update Team page access
on:
  push:
    paths:
      - '.github/workflows/update-team-page-access-20260915.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync current dashboard permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Team access editor
          p = Path('team.js')
          s = p.read_text()
          s = s.replace('["leads", "Leads"],', '["crm", "CRM"],\n    ["deleted-leads", "Deleted Leads"],')
          s = s.replace('"dashboard", "leads", "staging", "outreach", "ideas", "scripts",', '"dashboard", "crm", "staging", "outreach", "ideas", "scripts",')
          p.write_text(s)

          # Dashboard permission allow-list: preserve the new permission key.
          p = Path('js.js')
          s = p.read_text()
          if '"deleted-leads"' not in s.split('const ROLE_VIEWS',1)[0]:
              s = s.replace('    "crm",\n    "outreach",', '    "crm",\n    "deleted-leads",\n    "outreach",', 1)
          s = s.replace('      ? metadata.dashboard_views.filter(view => ALL_VIEWS.includes(view))', '      ? metadata.dashboard_views.map(view => view === "leads" ? "crm" : view).filter(view => ALL_VIEWS.includes(view))')
          p.write_text(s)

          # Team admin backend source.
          p = Path('supabase/functions/team-admin/index.ts')
          s = p.read_text()
          s = re.sub(
              r'const ALL_VIEWS = \[.*?\] as const;',
              '''const ALL_VIEWS = [\n  "dashboard", "crm", "deleted-leads", "outreach", "staging", "review",\n  "clients", "requests", "ideas", "scripts", "assets", "seo", "domain",\n  "hosting", "prospects", "onboarding", "data-collection", "payment",\n  "site-development", "delivery", "reports", "team",\n] as const;''',
              s,
              flags=re.S,
          )
          s = re.sub(
              r'const ROLE_DEFAULTS: Record<string, string\[\]> = \{.*?\n\};',
              '''const ROLE_DEFAULTS: Record<string, string[]> = {\n  ADMIN: [...ALL_VIEWS],\n  MOD: [\n    "dashboard", "crm", "staging", "outreach", "ideas", "scripts",\n    "assets", "seo", "prospects", "onboarding", "data-collection", "payment",\n    "site-development", "delivery", "reports",\n  ],\n  SALES: ["outreach"],\n  BUILDER: ["staging"],\n};''',
              s,
              flags=re.S,
          )
          s = s.replace(
              '  const requested = Array.isArray(value) ? value.map(String) : [];',
              '  const requested = Array.isArray(value) ? value.map(String).map((view) => view === "leads" ? "crm" : view) : [];'
          )
          p.write_text(s)

          # Bust Team page/script caches.
          p = Path('team.html')
          s = p.read_text()
          s = re.sub(r'team\.js\?v=[^"\']+', 'team.js?v=current-pages-20260915-1', s)
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          s = re.sub(r'team\.html\?v=[^"\']+', 'team.html?v=current-pages-20260915-1', s)
          s = re.sub(r'js\.js\?v=[^"\']+', 'js.js?v=current-pages-20260915-1', s)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add team.js team.html js.js index.html supabase/functions/team-admin/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "Sync Team access with CRM and Deleted Leads"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 2
          done
          exit 1
