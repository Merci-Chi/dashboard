name: Fix Staging copy count
on:
  push:
    paths:
      - '.github/workflows/fix-staging-copy-count.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove copy-list deduping
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('staging.js')
          s=p.read_text()
          old="return [...new Set(keys)].join('\\n');"
          new="return keys.join('\\n');"
          if old not in s:
              raise SystemExit('target copy-list line not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          h=Path('staging.html')
          hs=h.read_text()
          hs=hs.replace('staging.js?v=bulk-drop-20260915-3','staging.js?v=copy-count-20260915-1')
          h.write_text(hs)
          PY
      - name: Commit fix
        run: |
          git config user.name "Merci-Chi"
          git config user.email "actions@users.noreply.github.com"
          git add staging.js staging.html
          git commit -m "Match Staging copied counts to filter counts"
          git push
