name: Bump Staging admin cache
on:
  push:
    paths:
      - '.github/workflows/bump-staging-admin-cache.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump Staging iframe cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'staging\.html\?v=[^"\']+', 'staging.html?v=admin-staging-20260914-1', s)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'Merci-Chi'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Load new Staging admin queue [skip ci]'
          git push
