name: Replace Leads with CRM
on:
  push:
    paths: ['.github/workflows/replace-leads-with-crm.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard navigation and permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<a class="nav-item" href="#leads" data-view="leads"><i class="bi bi-person-lines-fill"></i><span>Leads</span></a>', '<a class="nav-item" href="#crm" data-view="crm"><i class="bi bi-database-fill"></i><span>CRM</span></a>')
          old='''      <section class="view leads-view leads-embed-view" id="view-leads" data-page="leads" aria-label="Leads">\n        <iframe class="leads-iframe" id="leadsFrame" src="leads/index.html?v=lead-filters-20260913-1" title="Lead Board"></iframe>\n      </section>'''
          new='''      <section class="view pipeline-embed-view" id="view-crm" data-page="crm" aria-label="CRM">\n        <iframe class="pipeline-iframe" id="crmFrame" src="crm.html?v=crm-editor-20260915-1" title="CRM Workspace"></iframe>\n      </section>'''
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('js.js')
          s=p.read_text()
          s=s.replace('    "leads",\n', '    "crm",\n')
          s=s.replace('      "leads",\n', '      "crm",\n')
          # Backward-compatible server permission mapping: existing "leads" => "crm"
          old="""      const configuredViews = Array.isArray(serverPermissions.views)\n        ? serverPermissions.views.filter(view => ALL_VIEWS.includes(view) && view !== \"team\")\n        : [];"""
          new="""      const configuredViews = Array.isArray(serverPermissions.views)\n        ? serverPermissions.views\n            .map(view => view === \"leads\" ? \"crm\" : view)\n            .filter(view => ALL_VIEWS.includes(view) && view !== \"team\")\n        : [];"""
          s=s.replace(old,new)
          s=s.replace('if (metadata.dashboard_role === "leads") {', 'if (metadata.dashboard_role === "leads" || metadata.dashboard_role === "crm") {')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "Merci-Chi"
          git config user.email "actions@users.noreply.github.com"
          git add index.html js.js
          git diff --cached --quiet || git commit -m "Replace Leads tab with CRM editor"
          git push
