name: Wire Outreach notes alerts
on:
  push:
    branches: [main]
    paths:
      - 'outreach-notes-alerts.js'
      - '.github/workflows/add-outreach-notes-alerts.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject notes alerts script and bump iframe
        shell: python
        run: |
          from pathlib import Path
          p=Path('outreach.html')
          s=p.read_text()
          tag='<script src="outreach-notes-alerts.js?v=notes-alerts-20260915-1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          import re
          s=re.sub(r'outreach\.html\?v=[^"\']+', 'outreach.html?v=notes-alerts-20260915-1', s)
          p.write_text(s)
      - name: Commit change
        run: |
          git config user.name "Merci-Chi"
          git config user.email "actions@users.noreply.github.com"
          git add outreach.html index.html
          git diff --cached --quiet || git commit -m "Wire Outreach notes and alerts [skip ci]"
          git push