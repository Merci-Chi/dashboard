name: Cleanup Review and Live
on:
  push:
    paths:
      - '.github/workflows/cleanup-review-live.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove hidden Live embed and bump Review cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'\n\s*<section class="view pipeline-embed-view" id="view-live"[^\n]*</section>', '', s)
          s=s.replace('src="review.html" title="Code Review"', 'src="review.html?v=publish-viewyoursite-20260914-1" title="Code Review"')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'Merci-Chi'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove Live embed and load ViewYourSite Review flow [skip ci]'
          git push
