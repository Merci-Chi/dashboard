name: Fix CRM master tags v2
on:
  push:
    paths:
      - '.github/workflows/fix-crm-master-tags-v2.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('crm-easy-controls.js')
          s=p.read_text()
          if 'const MASTER_TAGS=' not in s:
              insert="""  const MASTER_TAGS=['Broken Site','Outdated Site','Site Removed','Spanish?','No Phone','Hot Lead','Interested','Call Back','Needs More Info','Skeptical','No Answer','Not Interested','Wrong Number'];\n  const MASTER_SOURCES=['Google','Google Maps','Yelp','Facebook','Instagram','Nextdoor','Facebook Marketplace','TikTok','Reddit','Threads','LinkedIn','X / Twitter','OfferUp','Other'];\n  const tagColorGroups={\n    blue:new Set(['Broken Site','Outdated Site','Site Removed']),\n    purple:new Set(['Spanish?','No Phone']),\n    orange:new Set(['Hot Lead','Interested','Call Back','Needs More Info','Skeptical']),\n    red:new Set(['No Answer','Not Interested','Wrong Number'])\n  };\n"""
              s=s.replace("  const colorClasses=['blue','purple','red','orange','yellow'];\n", "  const colorClasses=['blue','purple','orange','red','yellow'];\n"+insert)
              s=re.sub(r"  function colorIndex\(value\)\{.*?\n  \}\n  function uniqueSorted", """  function colorIndex(value){\n    for(const [name,set] of Object.entries(tagColorGroups))if(set.has(String(value||'').trim()))return colorClasses.indexOf(name);\n    let h=0;for(const ch of String(value||'').toLowerCase())h=((h<<5)-h)+ch.charCodeAt(0);\n    return Math.abs(h)%colorClasses.length;\n  }\n  function uniqueSorted""", s, flags=re.S)
              s=re.sub(r"  function availableValues\(kind\)\{.*?\n  \}\n  function selectedList", """  function availableValues(kind){\n    const key=kind==='tag'?'tags':'sources';\n    const master=kind==='tag'?MASTER_TAGS:MASTER_SOURCES;\n    const all=[...master];\n    if(typeof leads!=='undefined'&&Array.isArray(leads))for(const lead of leads)if(Array.isArray(lead?.[key]))all.push(...lead[key]);\n    if(kind==='tag'&&typeof tags!=='undefined'&&Array.isArray(tags))all.push(...tags);\n    if(kind==='source'&&typeof sources!=='undefined'&&Array.isArray(sources))all.push(...sources);\n    return uniqueSorted(all);\n  }\n  function selectedList""", s, flags=re.S)
              s=s.replace(".tag-add{margin-top:10px}.tag-add .btn{border-radius:999px}", ".tag-add{display:none!important}.tag-add .btn{border-radius:999px}")
          p.write_text(s)

          p=Path('crm.html'); s=p.read_text();
          s=re.sub(r'crm-easy-controls\.js\?v=20260915-\d+', 'crm-easy-controls.js?v=20260915-7', s)
          p.write_text(s)

          p=Path('index.html'); s=p.read_text();
          s=re.sub(r'crm\.html\?v=easy-controls-20260915-\d+', 'crm.html?v=easy-controls-20260915-7', s)
          p.write_text(s)
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crm-easy-controls.js crm.html index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Use full CRM master tag and source lists'
            git pull --rebase origin main
            git push origin main
          fi
