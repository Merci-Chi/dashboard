name: Update sidebar and SALES access

on:
  push:
    paths:
      - '.github/workflows/update-sidebar-sales.yml'

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Live and Contact and make SALES Outreach-only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Sidebar + cache keys
          p = Path('index.html')
          s = p.read_text()
          s = re.sub(r'\n\s*<a class="nav-item" href="#live" data-view="live">.*?</a>', '', s)
          s = re.sub(r'\n\s*<a class="nav-item" href="#contact" data-view="contact">.*?</a>', '', s)
          s = re.sub(r'js\.js\?v=[^"\']+', 'js.js?v=sales-outreach-only-20260914-1', s)
          s = re.sub(r'team\.html\?v=[^"\']+', 'team.html?v=sales-outreach-only-20260914-1', s)
          p.write_text(s)

          # Main permission model: remove Live/Contact entirely and SALES -> Outreach only.
          p = Path('js.js')
          s = p.read_text()
          s = s.replace('    "live",\n', '')
          s = s.replace('    "contact",\n', '')
          s = s.replace('      "live",\n', '')
          s = s.replace('    SALES: ["leads", "outreach"],', '    SALES: ["outreach"],')
          p.write_text(s)

          # Team role builder: do not offer Live/Contact and SALES defaults to Outreach only.
          p = Path('team.js')
          s = p.read_text()
          s = s.replace('    ["live", "Live"],\n', '')
          s = s.replace('    ["contact", "Contact"],\n', '')
          s = s.replace('      "dashboard", "leads", "staging", "outreach", "live", "ideas", "scripts",', '      "dashboard", "leads", "staging", "outreach", "ideas", "scripts",')
          s = s.replace('    SALES: ["leads", "outreach"],', '    SALES: ["outreach"],')
          p.write_text(s)

          # Force fresh team.js inside Team iframe.
          p = Path('team.html')
          s = p.read_text()
          s = re.sub(r'team\.js\?v=[^"\']+', 'team.js?v=sales-outreach-only-20260914-1', s)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'Merci-Chi'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html js.js team.js team.html
          git commit -m 'Remove Live and Contact; make SALES Outreach-only [skip ci]'
          git push
