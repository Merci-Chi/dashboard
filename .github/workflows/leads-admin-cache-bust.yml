name: Leads admin cache bust

on:
  push:
    paths:
      - '.github/workflows/leads-admin-cache-bust.yml'

permissions:
  contents: write

jobs:
  bump-leads-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump Leads JS cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('leads/index.html')
          s = p.read_text()
          s = s.replace('js.js?v=lead-filters-20260913-1', 'js.js?v=admin-role-20260914-1')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'Merci-Chi'
          git config user.email 'actions@users.noreply.github.com'
          git add leads/index.html
          git commit -m 'Bust Leads cache for admin role permissions [skip ci]'
          git push
