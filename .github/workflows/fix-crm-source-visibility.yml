name: Fix CRM source visibility
on:
  push:
    paths:
      - '.github/workflows/fix-crm-source-visibility.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('crm-easy-controls.js')
          s=p.read_text()
          s=s.replace("  const MASTER_SOURCES=['Google','Google Maps','Yelp','Facebook','Instagram','Nextdoor','Facebook Marketplace','TikTok','Reddit','Threads','LinkedIn','X / Twitter','OfferUp','Other'];",
                      "  const MASTER_SOURCES=['Google','Google Maps','Yelp','Facebook','Instagram','Nextdoor','Facebook Marketplace','TikTok','Reddit','Threads','LinkedIn','X / Twitter','OfferUp'];")
          s=re.sub(r"  function availableValues\(kind\)\{.*?\n  \}\n  function selectedList", """  function availableValues(kind){
    const key=kind==='tag'?'tags':'sources';
    if(kind==='source'){
      const currentCustom=(typeof sources!=='undefined'&&Array.isArray(sources))?sources:[];
      return uniqueSorted([...MASTER_SOURCES,...currentCustom]);
    }
    const all=[...MASTER_TAGS];
    if(typeof leads!=='undefined'&&Array.isArray(leads))for(const lead of leads)if(Array.isArray(lead?.[key]))all.push(...lead[key]);
    if(typeof tags!=='undefined'&&Array.isArray(tags))all.push(...tags);
    return uniqueSorted(all);
  }
  function selectedList""", s, flags=re.S)
          p.write_text(s)

          p=Path('crm.html')
          s=p.read_text()
          s=re.sub(r'crm-easy-controls\.js\?v=20260915-\d+', 'crm-easy-controls.js?v=20260915-8', s)
          p.write_text(s)
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crm-easy-controls.js crm.html
          git diff --cached --quiet && exit 0
          git commit -m 'Limit CRM custom sources to current record'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 2
          done
          exit 1
