name: Apply CRM Outreach easy controls
on:
  push:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch CRM Outreach and cache versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          helper=Path('crm-easy-controls.js')
          text=helper.read_text()
          text=text.replace("const MASTER_SOURCES=['Google','Google Maps','Yelp','Facebook','Instagram','Nextdoor','Facebook Marketplace','TikTok','Reddit','Threads','LinkedIn','X / Twitter','OfferUp','Other'];",
                            "const MASTER_SOURCES=['Google','Google Maps','Yelp','Facebook','Instagram','Nextdoor','Facebook Marketplace','TikTok','Reddit','Threads','LinkedIn','X / Twitter','OfferUp'];")
          text=re.sub(
            r"  function availableValues\(kind\)\{.*?\n  \}\n  function selectedList",
            """  function availableValues(kind){
    const key=kind==='tag'?'tags':'sources';
    if(kind==='source'){
      const currentRecordSources=(typeof sources!=='undefined'&&Array.isArray(sources))?sources:[];
      return uniqueSorted([...MASTER_SOURCES,...currentRecordSources]);
    }
    const all=[...MASTER_TAGS];
    if(typeof leads!=='undefined'&&Array.isArray(leads))for(const lead of leads)if(Array.isArray(lead?.[key]))all.push(...lead[key]);
    if(typeof tags!=='undefined'&&Array.isArray(tags))all.push(...tags);
    return uniqueSorted(all);
  }
  function selectedList""",
            text,
            flags=re.S
          )
          helper.write_text(text)

          crm=Path('crm.html')
          text=crm.read_text()
          text=re.sub(r'<script src="crm-easy-controls\.js[^\"]*"></script>\s*','',text)
          text=text.replace('</body>','<script src="crm-easy-controls.js?v=20260915-8"></script>\n</body>')
          crm.write_text(text)

          outreach=Path('outreach.html')
          text=outreach.read_text()
          text=re.sub(r'<script src="outreach-followup\.js[^\"]*"></script>\s*','',text)
          text=text.replace('</body>','<script src="outreach-followup.js?v=20260915-2"></script>\n</body>')
          outreach.write_text(text)

          idx=Path('index.html')
          text=idx.read_text()
          text=re.sub(r'crm\.html\?v=[^"\']+', 'crm.html?v=source-scope-20260915-1', text)
          text=re.sub(r'outreach\.html\?v=[^"\']+', 'outreach.html?v=followup-calendar-20260915-3', text)
          idx.write_text(text)
          PY
      - name: Commit changes if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crm-easy-controls.js crm.html outreach.html index.html
          if ! git diff --cached --quiet; then
            git commit -m "Apply scoped CRM source choices"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && exit 0
              sleep 2
            done
            exit 1
          fi
