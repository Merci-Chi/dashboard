name: Admin role cleanup

on:
  push:
    paths:
      - '.github/workflows/admin-role-cleanup.yml'

permissions:
  contents: write

jobs:
  update-leads-permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Kiara-specific permission wording with admin role wording
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('leads/js.js')
          s = p.read_text()
          replacements = {
              'currentUserIsKiara': 'currentUserIsAdmin',
              'Only Kiara can delete history entries': 'Only admins can delete history entries',
              'Only Kiara can use the Hot Lead tag': 'Only admins can use the Hot Lead tag',
              'Only Kiara can delete leads': 'Only admins can delete leads',
              'Only Kiara can edit leads': 'Only admins can edit leads',
              'Only Kiara can edit lead status': 'Only admins can edit lead status',
              'KIARA ONLY': 'ADMIN ONLY',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'Merci-Chi'
          git config user.email 'actions@users.noreply.github.com'
          git add leads/js.js
          git commit -m 'Use admin role for lead editing permissions [skip ci]'
          git push
