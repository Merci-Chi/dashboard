name: Fix Staging all and remove JSON tools
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-staging-all-remove-json.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Staging
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          html = Path('staging.html').read_text()
          js = Path('staging.js').read_text()
          index = Path('index.html').read_text()

          # Remove JSON controls from toolbar.
          for button_id in ['copyJsonTemplate','openJsonImport','chooseJsonFile']:
              html = re.sub(r'\s*<button[^>]*id="'+button_id+r'"[\s\S]*?</button>', '', html)

          # Remove JSON import panel and hidden JSON file input.
          html = re.sub(r'\n\s*<div class="import-panel" id="jsonImportPanel"[\s\S]*?</div>\s*\n\s*<input class="staging-search"', '\n\n    <input class="staging-search"', html, count=1)
          html = re.sub(r'\n<input id="jsonFilePicker"[^>]*>', '', html)

          # Remove jsonFilePicker variable.
          js = js.replace(",jsonFilePicker=document.getElementById('jsonFilePicker')", "")

          # Make All truly all leads, while website/admin remain filtered.
          old = "let matches=leads.filter(inQueue).filter(lead=>!q||[lead.company,lead.name,lead.phone,lead.email,lead.sitekey].some(value=>String(value||'').toLowerCase().includes(q)));\n    if(filterMode==='website')matches=matches.filter(needsWebsite);\n    if(filterMode==='admin')matches=matches.filter(needsAdmin);"
          new = "let matches=leads.filter(lead=>!q||[lead.company,lead.name,lead.phone,lead.email,lead.sitekey].some(value=>String(value||'').toLowerCase().includes(q)));\n    if(filterMode==='website')matches=matches.filter(needsWebsite);\n    if(filterMode==='admin')matches=matches.filter(needsAdmin);"
          if old not in js:
              raise SystemExit('renderList target not found')
          js = js.replace(old, new)

          # Make Copy Full List copy every lead/site, not only queue items.
          js = js.replace("let rows=leads.filter(inQueue);", "let rows=[...leads];")

          # Remove JSON import helpers/handlers completely.
          start = js.find('  function normalizeImport(raw){')
          end = js.find("  document.getElementById('stagingFilters').onclick", start)
          if start != -1 and end != -1:
              replacement = "  function copyListRows(mode='all'){\n    let rows=[...leads];\n    if(mode==='website')rows=rows.filter(needsWebsite);\n    if(mode==='admin')rows=rows.filter(needsAdmin);\n    const keys=rows.map(lead=>{const p=projectFor(lead);return slug(lead.sitekey||p?.sitekey||lead.company||lead.name)}).filter(Boolean);\n    return [...new Set(keys)].join('\\n');\n  }\n  async function copyQueueList(mode,label){\n    const text=copyListRows(mode);\n    if(!text){message(`No ${label.toLowerCase()} items to copy.`,true);return}\n    await navigator.clipboard.writeText(text);\n    message(`${text.split('\\n').length} ${label.toLowerCase()} item${text.includes('\\n')?'s':''} copied.`);\n  }\n\n  document.getElementById('copyFullList').onclick=()=>copyQueueList('all','Full List');\n  document.getElementById('copyNeedsSite').onclick=()=>copyQueueList('website','Needs Site');\n  document.getElementById('copyNeedsAdmin').onclick=()=>copyQueueList('admin','Needs Admin');\n\n"
              js = js[:start] + replacement + js[end:]
          else:
              raise SystemExit('JSON helper block boundaries not found')

          # Better status wording.
          js = js.replace("message(`${matches.length} shown · ${websiteCount} need website · ${adminCount} need admin`);", "message(`${matches.length} shown · ${leads.length} total · ${websiteCount} need website · ${adminCount} need admin`);")

          # Cache bust Staging JS and iframe.
          html = re.sub(r'staging\.js\?v=[^"<]+', 'staging.js?v=all-sites-no-json-20260915-1', html)
          index = re.sub(r'staging\.html\?v=[^"<]+', 'staging.html?v=all-sites-no-json-20260915-1', index)

          Path('staging.html').write_text(html)
          Path('staging.js').write_text(js)
          Path('index.html').write_text(index)
          PY
      - name: Commit changes
        run: |
          git config user.name "Merci-Chi"
          git config user.email "actions@github.com"
          git add staging.html staging.js index.html
          git commit -m "Make Staging All show every site and remove JSON tools" || exit 0
          git push
