name: Sold to Review

on:
  push:
    paths:
      - '.github/workflows/sold-to-review.yml'

permissions:
  contents: write

jobs:
  patch-sold-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Sold a call outcome that moves site to Review
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('leads/js.js')
          s = js_path.read_text()

          # Remove Sold from the normal lead tag list.
          s = s.replace("  'Wrong Number',\n  'Sold'\n];", "  'Wrong Number'\n];")

          # Remove the dedicated Conversion/Sold tag group if present.
          s = re.sub(r",?\n\s*\{\n\s*key: 'conversion',\n\s*title: 'Conversion',\n\s*description: 'Completed sales',\n\s*tags: \['Sold'\]\n\s*\}", "", s)

          # Sold is not a normal follow-up tag anymore.
          s = s.replace("const FOLLOWUP_TAGS = new Set(['Hot Lead', 'Interested', 'Needs More Info', 'Skeptical', 'Call Back', 'No Answer', 'Wrong Number', 'Not Interested', 'Sold']);",
                        "const FOLLOWUP_TAGS = new Set(['Hot Lead', 'Interested', 'Needs More Info', 'Skeptical', 'Call Back', 'No Answer', 'Wrong Number', 'Not Interested']);")

          # Call-outcome compatibility: old Conversion values are treated as Sold.
          s = s.replace("    'Sold': 'Conversion'", "    'Conversion': 'Sold'")
          s = s.replace("if (normalizedValue === 'Conversion')", "if (normalizedValue === 'Sold')")
          s = s.replace("buttonValue === 'Conversion'", "buttonValue === 'Sold'")
          s = s.replace("value === 'Conversion'", "value === 'Sold'")

          # End-of-call: Sold launches the sold flow directly instead of being written into tags.
          old_handler = """$('#savePostCallButton')?.addEventListener('click', async () => {\n  const button = $('#savePostCallButton');\n  button.disabled = true;\n  const lead = await savePostCallCompletion();\n  if (!lead) return;\n\n  pendingCallLeadId = '';\n  callLaunchAt = 0;\n  setPostCallStep(3);\n  postCallCompletionTimer = setTimeout(async () => {\n    closeModal('postCallModal');\n    button.disabled = false;\n    if (postCallTag === 'Conversion') {\n      beginSoldFlow();\n      return;\n    }\n    await finishLeadAndExit(postCallTag);\n  }, 1450);\n});"""
          new_handler = """$('#savePostCallButton')?.addEventListener('click', async () => {\n  const button = $('#savePostCallButton');\n  button.disabled = true;\n\n  if (postCallTag === 'Sold') {\n    pendingCallLeadId = '';\n    callLaunchAt = 0;\n    closeModal('postCallModal');\n    button.disabled = false;\n    beginSoldFlow();\n    return;\n  }\n\n  const lead = await savePostCallCompletion();\n  if (!lead) {\n    button.disabled = false;\n    return;\n  }\n\n  pendingCallLeadId = '';\n  callLaunchAt = 0;\n  setPostCallStep(3);\n  postCallCompletionTimer = setTimeout(async () => {\n    closeModal('postCallModal');\n    button.disabled = false;\n    await finishLeadAndExit(postCallTag);\n  }, 1450);\n});"""
          if old_handler in s:
              s = s.replace(old_handler, new_handler)
          else:
              # Handle already-renamed branch from prior replacements.
              old_handler2 = old_handler.replace("postCallTag === 'Conversion'", "postCallTag === 'Sold'")
              if old_handler2 not in s:
                  raise SystemExit('Post-call save handler not found')
              s = s.replace(old_handler2, new_handler)

          # Add helper that moves/creates the linked site project in Review.
          marker = "function finalizeSoldAndDraftEmail() {"
          helper = """async function sendSoldLeadToReview(lead) {\n  if (!lead?.id || !supabaseSession) throw new Error('Lead session is not ready');\n\n  const { data: existingRows, error: lookupError } = await supabaseClient\n    .from('sites')\n    .select('id,stage')\n    .eq('crmid', lead.id)\n    .neq('stage', 'archived')\n    .order('updated', { ascending: false })\n    .limit(1);\n\n  if (lookupError) throw lookupError;\n\n  const existing = existingRows?.[0];\n  if (existing?.id) {\n    const { error } = await supabaseClient\n      .from('sites')\n      .update({ stage: 'review', updated: new Date().toISOString() })\n      .eq('id', existing.id);\n    if (error) throw error;\n    return existing.id;\n  }\n\n  const { data, error } = await supabaseClient\n    .from('sites')\n    .insert({\n      crmid: lead.id,\n      source: 'dashboard',\n      sourceid: `sold:${lead.id}:${Date.now()}`,\n      name: lead.company || lead.name || 'Unnamed lead',\n      stage: 'review',\n      files: [],\n      checks: {},\n      original: {\n        contact_name: lead.name || '',\n        email: lead.email || '',\n        phone: lead.phone || ''\n      }\n    })\n    .select('id')\n    .single();\n\n  if (error) throw error;\n  return data?.id || '';\n}\n\n"""
          if helper.strip() not in s:
              if marker not in s:
                  raise SystemExit('finalizeSoldAndDraftEmail marker not found')
              s = s.replace(marker, helper + marker)

          # Sold status is stored in CRM status/outcome/history, not the tags array.
          old_sold = """  lead.tag = 'Sold';\n  lead.tags = Array.isArray(lead.tags) ? lead.tags : [];\n  if (!lead.tags.some(tag => String(tag || '').trim().toLowerCase() === 'sold')) lead.tags.push('Sold');\n  lead.status = 'sold';"""
          new_sold = """  lead.tags = (Array.isArray(lead.tags) ? lead.tags : [])\n    .filter(tag => String(tag || '').trim().toLowerCase() !== 'sold');\n  if (String(lead.tag || '').trim().toLowerCase() === 'sold') lead.tag = '';\n  lead.outcome = 'Sold';\n  lead.status = 'sold';"""
          if old_sold not in s:
              raise SystemExit('Sold tag assignment block not found')
          s = s.replace(old_sold, new_sold)

          # After CRM sync, push linked project to Review and open Review.
          old_sync = """  syncLeadNow(lead).then(() => {\n    if (!currentUserIsAdmin()) {\n      lead.phone = '';\n      renderLists();\n    }\n    showSyncStatus('Sold lead synced');\n  }).catch(error => {\n    console.error('Could not sync sold lead:', error);\n    queueLeadSync(lead.id);\n    showSyncStatus('Sync failed');\n  });\n\n  window.location.href = mailto;"""
          new_sync = """  syncLeadNow(lead)\n    .then(() => sendSoldLeadToReview(lead))\n    .then(() => {\n      if (!currentUserIsAdmin()) {\n        lead.phone = '';\n        renderLists();\n      }\n      showSyncStatus('Sold · Sent to Review');\n      toast('Sold · Sent to Review');\n      if (window.parent && window.parent !== window) {\n        window.parent.location.hash = 'review';\n      }\n    })\n    .catch(error => {\n      console.error('Could not finish sold lead:', error);\n      queueLeadSync(lead.id);\n      showSyncStatus('Sold saved, Review move failed');\n      toast('Sold saved, but could not send to Review');\n    });\n\n  window.location.href = mailto;"""
          if old_sync not in s:
              raise SystemExit('Sold sync block not found')
          s = s.replace(old_sync, new_sync)

          js_path.write_text(s)

          html_path = Path('leads/index.html')
          html = html_path.read_text()
          html = html.replace('data-call-outcome="Conversion"', 'data-call-outcome="Sold"')
          html = html.replace('<i class="bi bi-trophy-fill"></i> Conversion', '<i class="bi bi-trophy-fill"></i> Sold')
          html = html.replace('data-post-tag="Conversion"', 'data-post-tag="Sold"')
          # Any plain button label immediately tied to post-call Conversion.
          html = re.sub(r'(data-post-tag="Sold"[^>]*>)(.*?)(Conversion)(.*?</button>)', lambda m: m.group(1)+m.group(2)+'Sold'+m.group(4), html, flags=re.S)
          html = re.sub(r'js\.js\?v=[^"\']+', 'js.js?v=sold-to-review-20260914-1', html)
          html_path.write_text(html)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'Merci-Chi'
          git config user.email 'actions@users.noreply.github.com'
          git add leads/js.js leads/index.html
          git commit -m 'Make Sold call outcome send sites to Review [skip ci]'
          git push
