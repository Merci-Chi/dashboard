name: Fix CRM source scope v3
on:
  push:
    paths:
      - '.github/workflows/fix-crm-source-scope-v3.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scope sources to current CRM
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('crm-easy-controls.js')
          s=p.read_text()
          old="const MASTER_SOURCES=['Google','Google Maps','Yelp','Facebook','Instagram','Nextdoor','Facebook Marketplace','TikTok','Reddit','Threads','LinkedIn','X / Twitter','OfferUp','Other'];"
          new="const MASTER_SOURCES=['Google','Google Maps','Yelp','Facebook','Instagram','Nextdoor','Facebook Marketplace','TikTok','Reddit','Threads','LinkedIn','X / Twitter','OfferUp'];"
          s=s.replace(old,new)
          pattern=r"  function availableValues\(kind\)\{.*?\n  \}\n  function selectedList"
          replacement="""  function availableValues(kind){
    const key=kind==='tag'?'tags':'sources';
    if(kind==='source'){
      const currentRecordSources=(typeof sources!=='undefined'&&Array.isArray(sources))?sources:[];
      return uniqueSorted([...MASTER_SOURCES,...currentRecordSources]);
    }
    const all=[...MASTER_TAGS];
    if(typeof leads!=='undefined'&&Array.isArray(leads))for(const lead of leads)if(Array.isArray(lead?.[key]))all.push(...lead[key]);
    if(typeof tags!=='undefined'&&Array.isArray(tags))all.push(...tags);
    return uniqueSorted(all);
  }
  function selectedList"""
          s,count=re.subn(pattern,replacement,s,flags=re.S)
          if count != 1:
              raise SystemExit(f'availableValues replacement count was {count}')
          p.write_text(s)

          p=Path('crm.html')
          s=p.read_text()
          s=re.sub(r'crm-easy-controls\.js\?v=20260915-\d+', 'crm-easy-controls.js?v=20260915-8', s)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "Merci-Chi"
          git config user.email "actions@users.noreply.github.com"
          git add crm-easy-controls.js crm.html
          git diff --cached --quiet && exit 0
          git commit -m "Limit custom sources to current CRM"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 2
          done
          exit 1
