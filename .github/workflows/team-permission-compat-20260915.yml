name: Team permission compatibility bridge
on:
  push:
    paths:
      - '.github/workflows/team-permission-compat-20260915.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add old-new permission compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('team.js')
          s=p.read_text()
          marker='  function selectedViews(container) {\n    return [...container.querySelectorAll("[data-permission]:checked")].map((input) => input.value);\n  }\n'
          replacement='''  function selectedViews(container) {\n    return [...container.querySelectorAll("[data-permission]:checked")].map((input) => input.value);\n  }\n\n  function displayViews(views) {\n    const selected = new Set((views || []).map(String));\n    if (selected.has("leads")) selected.add("crm");\n    if (selected.has("live")) selected.add("deleted-leads");\n    return VIEWS.map(([value]) => value).filter((value) => selected.has(value));\n  }\n\n  function backendViews(views) {\n    const selected = new Set((views || []).map(String));\n    // Send both current and legacy aliases so this works before and after\n    // the Team Edge Function is upgraded.\n    if (selected.has("crm")) selected.add("leads");\n    if (selected.has("deleted-leads")) selected.add("live");\n    return [...selected];\n  }\n'''
          if marker in s and 'function backendViews(' not in s:
              s=s.replace(marker,replacement,1)
          s=s.replace('renderPermissions(permissionContainer, member.views, member.role === "ADMIN" || locked);','renderPermissions(permissionContainer, displayViews(member.views), member.role === "ADMIN" || locked);')
          s=s.replace('views: selectedViews(permissionContainer),','views: backendViews(selectedViews(permissionContainer)),')
          s=s.replace('views: selectedViews($("#newPermissions")),','views: backendViews(selectedViews($("#newPermissions"))),')
          p.write_text(s)

          p=Path('js.js')
          s=p.read_text()
          s=s.replace('.map(view => view === "leads" ? "crm" : view)', '.map(view => view === "leads" ? "crm" : (view === "live" ? "deleted-leads" : view))')
          p.write_text(s)

          p=Path('team.html')
          s=p.read_text()
          s=re.sub(r'team\.js\?v=[^"\']+', 'team.js?v=current-pages-20260915-2', s)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'team\.html\?v=[^"\']+', 'team.html?v=current-pages-20260915-2', s)
          s=re.sub(r'js\.js\?v=[^"\']+', 'js.js?v=current-pages-20260915-2', s)
          p.write_text(s)
          PY
      - name: Commit compatibility update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add team.js team.html js.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Bridge current Team permissions to legacy backend keys"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 2
          done
          exit 1
