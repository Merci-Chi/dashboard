name: Add Staging bulk drop v2

on:
  push:
    paths:
      - '.github/workflows/add-bulk-drop-staging-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch files
        run: |
          python3 <<'PY'
          from pathlib import Path

          html_path = Path('staging.html')
          js_path = Path('staging.js')
          html = html_path.read_text()
          js = js_path.read_text()

          marker = '<button class="btn secondary" id="copyNeedsAdmin" type="button"><i class="bi bi-clipboard"></i> Copy Needs Admin</button>'
          if 'id="openBulkDrop"' not in html:
              html = html.replace(marker, marker + '\n        <button class="btn" id="openBulkDrop" type="button"><i class="bi bi-cloud-arrow-up-fill"></i> Bulk Drop</button>')

              search = '<input class="staging-search" id="stagingSearch" type="search" placeholder="Search leads…">'
              panel = '''<section class="import-panel" id="bulkDropPanel" hidden>
      <h3>Bulk Drop to GitHub</h3>
      <p>Drop multiple site folders here. They stay only in this browser until you push them to GitHub.</p>
      <div class="drop-zone" id="bulkDropZone" style="min-height:150px"><i class="bi bi-folder-plus"></i><strong>Drop site folders here</strong><span>Each folder should contain its own index.html.</span><div class="drop-actions"><button class="btn secondary" id="chooseBulkFolders" type="button">Choose Folders</button></div></div>
      <div id="bulkDropSummary" class="file-summary"><strong>0 folders · 0 files</strong><span>Local only</span></div>
      <div id="bulkDropList" class="file-list"><em>No folders queued.</em></div>
      <div class="import-row">
        <button class="btn secondary" id="clearBulkDrop" type="button">Clear Local Queue</button>
        <button class="btn" id="pushBulkGithub" type="button" disabled>Push All to GitHub</button>
      </div>
    </section>

    ''' + search
              html = html.replace(search, panel)
              html = html.replace('<input id="folderPicker" type="file" webkitdirectory directory multiple hidden>', '<input id="folderPicker" type="file" webkitdirectory directory multiple hidden>\n<input id="bulkFolderPicker" type="file" webkitdirectory directory multiple hidden>')

          html = html.replace('staging.js?v=all-sites-no-json-20260915-1', 'staging.js?v=bulk-drop-20260915-2')
          html = html.replace('staging.js?v=bulk-drop-20260915-1', 'staging.js?v=bulk-drop-20260915-2')

          if 'let bulkFiles=[];' not in js:
              js = js.replace("let db=null,leads=[],projects=[],active=null,activeProject=null,filterMode='all';", "let db=null,leads=[],projects=[],active=null,activeProject=null,filterMode='all';\n  let bulkFiles=[];")

          if 'function renderBulkQueue()' not in js:
              block = r'''
  function bulkRelativePath(file){return String(file.webkitRelativePath||file.pipelinePath||file.name||'').replace(/^\/+/, '').replace(/\\/g,'/');}
  function renderBulkQueue(){
    const panel=document.getElementById('bulkDropPanel'),list=document.getElementById('bulkDropList'),summary=document.getElementById('bulkDropSummary'),push=document.getElementById('pushBulkGithub');
    if(!panel||!list||!summary||!push)return;
    const folders=new Map();
    for(const file of bulkFiles){const path=bulkRelativePath(file),root=path.split('/')[0]||'unknown';if(!folders.has(root))folders.set(root,[]);folders.get(root).push(file)}
    const rows=[...folders.entries()];
    summary.innerHTML=`<strong>${rows.length} folder${rows.length===1?'':'s'} · ${bulkFiles.length} file${bulkFiles.length===1?'':'s'}</strong><span>Local only until pushed</span>`;
    list.innerHTML=rows.length?rows.map(([name,files])=>`<span><i class="bi bi-folder2-open"></i>${esc(name)}<small>${files.length} file${files.length===1?'':'s'}</small></span>`).join(''):'<em>No folders queued.</em>';
    push.disabled=!bulkFiles.length;
  }
  function queueBulkFiles(files){
    const incoming=[...files].filter(file=>file.name!=='.DS_Store'&&!bulkRelativePath(file).includes('/node_modules/')&&!bulkRelativePath(file).includes('/.git/'));
    const byPath=new Map(bulkFiles.map(file=>[bulkRelativePath(file),file]));
    for(const file of incoming){const path=bulkRelativePath(file);if(path&&path.includes('/'))byPath.set(path,file)}
    bulkFiles=[...byPath.values()];renderBulkQueue();
    message(`${incoming.length} file${incoming.length===1?'':'s'} added to local bulk queue.`);
  }
  async function pushBulkGithub(){
    if(!bulkFiles.length)return;
    const button=document.getElementById('pushBulkGithub');button.disabled=true;button.textContent='Pushing…';message('Publishing all queued folders to GitHub…');
    try{
      const form=new FormData();
      for(const file of bulkFiles){form.append('files',file,file.name);form.append('paths',bulkRelativePath(file))}
      const {data:sessionData}=await db.auth.getSession();const token=sessionData?.session?.access_token;if(!token)throw Error('Your dashboard session expired. Sign in again.');
      const response=await fetch('https://glonbvrcudwuzjundrii.supabase.co/functions/v1/publish-viewyoursite-bulk',{method:'POST',headers:{Authorization:`Bearer ${token}`},body:form});
      const text=await response.text();let data={};try{data=text?JSON.parse(text):{}}catch{data={error:text}}
      if(!response.ok||data?.error)throw Error(data?.error||`Bulk publish failed (${response.status})`);
      const count=data.siteCount||new Set(bulkFiles.map(file=>bulkRelativePath(file).split('/')[0])).size;
      bulkFiles=[];renderBulkQueue();message(`${count} site${count===1?'':'s'} pushed to GitHub in one commit.`);
    }catch(error){message(error.message||String(error),true)}finally{button.textContent='Push All to GitHub';button.disabled=!bulkFiles.length}
  }
'''
              needle = "  document.getElementById('copyFullList')"
              js = js.replace(needle, block + '\n' + needle)

          if "document.getElementById('openBulkDrop').onclick" not in js:
              handlers = r'''
  const bulkPanel=document.getElementById('bulkDropPanel'),bulkPicker=document.getElementById('bulkFolderPicker'),bulkZone=document.getElementById('bulkDropZone');
  document.getElementById('openBulkDrop').onclick=()=>{bulkPanel.hidden=!bulkPanel.hidden;if(!bulkPanel.hidden){renderBulkQueue();bulkPanel.scrollIntoView({behavior:'smooth',block:'start'})}};
  document.getElementById('chooseBulkFolders').onclick=()=>bulkPicker.click();
  bulkPicker.onchange=()=>{queueBulkFiles(bulkPicker.files);bulkPicker.value=''};
  document.getElementById('clearBulkDrop').onclick=()=>{bulkFiles=[];renderBulkQueue();message('Local bulk queue cleared.')};
  document.getElementById('pushBulkGithub').onclick=pushBulkGithub;
  bulkZone.ondragover=e=>{e.preventDefault();bulkZone.classList.add('dragging')};
  bulkZone.ondragleave=()=>bulkZone.classList.remove('dragging');
  bulkZone.ondrop=async e=>{e.preventDefault();bulkZone.classList.remove('dragging');try{queueBulkFiles(await dropped(e.dataTransfer))}catch(error){message(error.message,true)}};
'''
              js = js.replace("  document.getElementById('stagingFilters').onclick", handlers + '\n  document.getElementById(\'stagingFilters\').onclick')

          html_path.write_text(html)
          js_path.write_text(js)
          PY

      - name: Commit changes
        run: |
          rm -f .github/workflows/add-bulk-drop-staging.yml .github/workflows/add-bulk-drop-staging-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging.html staging.js .github/workflows/
          git commit -m "Add Staging bulk folder GitHub publisher"
          git push
