name: Scope Outreach alerts to exact CRM record
on:
  push:
    paths:
      - '.github/workflows/fix-outreach-alert-crm-scope.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact CRM alert scoping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('outreach-notes-alerts.js')
          s = p.read_text()

          s = s.replace(
            "let currentLead=null,currentRows=[],activeTab='notes',formKind='note',authorName='',isAdmin=false;",
            "let currentLead=null,currentRows=[],activeTab='notes',formKind='note',authorName='',isAdmin=false,selectedCrmId='';"
          )

          old = """  async function resolveLead(){\n    const company=visibleLeadText();if(!company)return null;\n    let q=client.from('crm').select('id,company,name,phone,notes').eq('company',company).limit(5);\n    const {data,error}=await q;if(error)throw error;if(!data?.length)return null;\n    if(data.length===1)return data[0];\n    const bodyText=document.body.innerText;\n    return data.find(x=>x.phone&&bodyText.includes(x.phone))||data[0];\n  }"""
          new = """  async function resolveLead(){\n    if(selectedCrmId){\n      const {data,error}=await client.from('crm').select('id,company,name,phone,notes').eq('id',selectedCrmId).maybeSingle();\n      if(error)throw error;\n      if(data)return data;\n    }\n    const company=visibleLeadText();if(!company)return null;\n    let q=client.from('crm').select('id,company,name,phone,notes').eq('company',company).limit(5);\n    const {data,error}=await q;if(error)throw error;if(!data?.length)return null;\n    if(data.length===1)return data[0];\n    const bodyText=document.body.innerText;\n    return data.find(x=>x.phone&&bodyText.includes(x.phone))||data[0];\n  }"""
          if old not in s:
            raise SystemExit('resolveLead block not found')
          s = s.replace(old, new)

          old_click = """  document.addEventListener('click',e=>{\n    if(e.target.closest('.back-button'))dismissPopup();\n    if(e.target.closest('.lead-choice')){dismissPopup();setTimeout(showLatestAlertForLead,350);}\n  });"""
          new_click = """  document.addEventListener('click',e=>{\n    if(e.target.closest('.back-button')){selectedCrmId='';currentLead=null;dismissPopup();}\n    const choice=e.target.closest('.lead-choice');\n    if(choice){\n      selectedCrmId=String(choice.dataset.leadId||'').trim();\n      currentLead=null;\n      dismissPopup();\n      setTimeout(showLatestAlertForLead,350);\n    }\n  });"""
          if old_click not in s:
            raise SystemExit('lead click block not found')
          s = s.replace(old_click, new_click)
          p.write_text(s)

          h = Path('outreach.html')
          if h.exists():
            text = h.read_text()
            text = re.sub(r'outreach-notes-alerts\.js(?:\?v=[^\"\']*)?', 'outreach-notes-alerts.js?v=crm-scope-20260915-1', text)
            h.write_text(text)
          PY
      - name: Commit changes
        run: |
          git config user.name "Merci-Chi"
          git config user.email "actions@users.noreply.github.com"
          git add outreach-notes-alerts.js outreach.html
          git diff --cached --quiet && exit 0
          git commit -m "Scope Outreach alerts to exact CRM record"
          git push