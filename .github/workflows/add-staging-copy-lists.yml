name: Add Staging copy lists
on:
  push:
    paths:
      - '.github/workflows/add-staging-copy-lists.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Staging copy list controls
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path('staging.html')
          s = html.read_text()
          old = '''      <div class="import-actions">\n        <button class="btn secondary" id="copyJsonTemplate" type="button"><i class="bi bi-clipboard"></i> Copy JSON Template</button>\n        <button class="btn secondary" id="openJsonImport" type="button"><i class="bi bi-braces"></i> Paste JSON</button>\n        <button class="btn secondary" id="chooseJsonFile" type="button"><i class="bi bi-filetype-json"></i> Import JSON File</button>\n      </div>'''
          new = '''      <div class="import-actions">\n        <button class="btn secondary" id="copyFullList" type="button"><i class="bi bi-clipboard"></i> Copy Full List</button>\n        <button class="btn secondary" id="copyNeedsSite" type="button"><i class="bi bi-clipboard"></i> Copy Needs Site</button>\n        <button class="btn secondary" id="copyNeedsAdmin" type="button"><i class="bi bi-clipboard"></i> Copy Needs Admin</button>\n        <button class="btn secondary" id="copyJsonTemplate" type="button"><i class="bi bi-clipboard"></i> Copy JSON Template</button>\n        <button class="btn secondary" id="openJsonImport" type="button"><i class="bi bi-braces"></i> Paste JSON</button>\n        <button class="btn secondary" id="chooseJsonFile" type="button"><i class="bi bi-filetype-json"></i> Import JSON File</button>\n      </div>'''
          if old not in s:
              raise SystemExit('staging.html toolbar block not found')
          s = s.replace(old, new)
          s = s.replace('staging.js?v=admin-staging-20260914-1','staging.js?v=copy-lists-20260915-1')
          html.write_text(s)

          js = Path('staging.js')
          s = js.read_text()
          anchor = "  const template=JSON.stringify([\"example-site\",\"another-site\"],null,2);\n"
          insert = '''  function copyListRows(mode='all'){\n    let rows=leads.filter(inQueue);\n    if(mode==='website')rows=rows.filter(needsWebsite);\n    if(mode==='admin')rows=rows.filter(needsAdmin);\n    const keys=rows.map(lead=>{const p=projectFor(lead);return slug(lead.sitekey||p?.sitekey||lead.company||lead.name)}).filter(Boolean);\n    return [...new Set(keys)].join('\\n');\n  }\n  async function copyQueueList(mode,label){\n    const text=copyListRows(mode);\n    if(!text){message(`No ${label.toLowerCase()} items to copy.`,true);return}\n    await navigator.clipboard.writeText(text);\n    message(`${text.split('\\n').length} ${label.toLowerCase()} item${text.includes('\\n')?'s':''} copied.`);\n  }\n\n'''
          if anchor not in s:
              raise SystemExit('template anchor not found in staging.js')
          s = s.replace(anchor, insert + anchor)
          handlers = '''  document.getElementById('copyFullList').onclick=()=>copyQueueList('all','Full List');\n  document.getElementById('copyNeedsSite').onclick=()=>copyQueueList('website','Needs Site');\n  document.getElementById('copyNeedsAdmin').onclick=()=>copyQueueList('admin','Needs Admin');\n'''
          s = s.replace("  document.getElementById('copyJsonTemplate').onclick=async()=>{", handlers + "  document.getElementById('copyJsonTemplate').onclick=async()=>{")
          js.write_text(s)

          index = Path('index.html')
          s = index.read_text()
          s = s.replace('staging.html?v=admin-staging-20260914-1','staging.html?v=copy-lists-20260915-1')
          index.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging.html staging.js index.html
          git commit -m "Add copyable Staging queue lists [skip ci]"
          git push
