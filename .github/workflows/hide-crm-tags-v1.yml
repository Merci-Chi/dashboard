name: Hide CRM tags
on:
  push:
    paths:
      - '.github/workflows/hide-crm-tags-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Hide internal CRM tags
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('crm-easy-controls.js')
          s = p.read_text()

          if "const HIDDEN_CRM_TAGS=" not in s:
              marker = "  const MASTER_SOURCES=['Google','Google Maps','Yelp','Facebook','Instagram','Nextdoor','Facebook Marketplace','TikTok','Reddit','Threads','LinkedIn','X / Twitter','OfferUp'];"
              s = s.replace(marker, marker + "\n  const HIDDEN_CRM_TAGS=new Set(['riverdale','atlanta','admin available','site built']);")

          s = s.replace(
              "    return uniqueSorted(all);\n  }\n  function selectedList",
              "    return uniqueSorted(all).filter(v=>!HIDDEN_CRM_TAGS.has(norm(v)));\n  }\n  function selectedList",
              1
          )
          p.write_text(s)

          h = Path('crm.html')
          hs = h.read_text()
          hs = re.sub(r'crm-easy-controls\\.js\\?v=20260915-\\d+', 'crm-easy-controls.js?v=20260915-9', hs)
          h.write_text(hs)

          idx = Path('index.html')
          ix = idx.read_text()
          ix = re.sub(r'crm\\.html\\?v=[^"\']+', 'crm.html?v=hidden-tags-20260915-1', ix)
          idx.write_text(ix)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crm-easy-controls.js crm.html index.html
          git diff --cached --quiet && exit 0
          git commit -m "Hide internal and location CRM tags"
          git pull --rebase origin main
          git push
