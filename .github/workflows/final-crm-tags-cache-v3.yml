name: Final CRM tags cache bump
on:
  push:
    paths:
      - '.github/workflows/final-crm-tags-cache-v3.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crm.html'); s=p.read_text(); s=s.replace('crm-easy-controls.js?v=20260915-2','crm-easy-controls.js?v=20260915-4').replace('crm-easy-controls.js?v=20260915-3','crm-easy-controls.js?v=20260915-4'); p.write_text(s)
          p=Path('index.html'); s=p.read_text();
          import re
          s=re.sub(r'crm\.html\?v=easy-controls-20260915-\d+', 'crm.html?v=easy-controls-20260915-5', s)
          p.write_text(s)
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crm.html index.html
          git diff --cached --quiet || (git commit -m 'Force all CRM tag source buttons live' && git push)
