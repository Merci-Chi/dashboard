name: Remove No Site tag

on:
  push:
    paths:
      - '.github/workflows/remove-no-site-tag.yml'

permissions:
  contents: write

jobs:
  patch-no-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove No Site as a CRM tag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Leads: remove No Site from tag choices, but keep it as a lead type/script classification.
          p = Path('leads/js.js')
          s = p.read_text()

          s = s.replace("  'No Site',\n  'Broken Site',", "  'Broken Site',")
          s = s.replace("    tags: ['No Site', 'Broken Site', 'Outdated Site', 'Site Removed']", "    tags: ['Broken Site', 'Outdated Site', 'Site Removed']")

          # Prevent leadtype='No Site' from being copied back into tags.
          old = """  const explicit = normalizeLeadType(lead.leadType);\n  if (LEAD_TYPE_TAGS.has(explicit)) {\n    const hasExplicit = lead.tags.some(tag => normalizeLeadType(tag) === explicit);\n    if (!hasExplicit) lead.tags.push(explicit);\n  } else {\n    const firstSiteTag = lead.tags.map(normalizeLeadType).find(tag => LEAD_TYPE_TAGS.has(tag)) || '';\n    lead.leadType = firstSiteTag;\n  }"""
          new = """  const explicit = normalizeLeadType(lead.leadType);\n  if (LEAD_TYPE_TAGS.has(explicit) && explicit !== 'No Site') {\n    const hasExplicit = lead.tags.some(tag => normalizeLeadType(tag) === explicit);\n    if (!hasExplicit) lead.tags.push(explicit);\n  } else if (!LEAD_TYPE_TAGS.has(explicit)) {\n    const firstSiteTag = lead.tags.map(normalizeLeadType).find(tag => LEAD_TYPE_TAGS.has(tag) && tag !== 'No Site') || '';\n    lead.leadType = firstSiteTag;\n  }\n\n  // No Site is a lead type/script classification, never a CRM tag.\n  lead.tags = lead.tags.filter(tag => normalizeLeadType(tag) !== 'No Site');"""
          if old not in s:
              raise SystemExit('Leads website tag normalization block not found')
          s = s.replace(old, new)
          p.write_text(s)

          # Outreach: remove No Site from the tag editor while preserving leadtype for scripts.
          p = Path('outreach.html')
          s = p.read_text()
          s = s.replace("tags:['No Site','Broken Site','Outdated Site','Site Removed']", "tags:['Broken Site','Outdated Site','Site Removed']")
          s = s.replace("siteTags=['No Site','Broken Site','Outdated Site','Site Removed']", "siteTags=['Broken Site','Outdated Site','Site Removed']")

          # Ensure any stale No Site value is filtered before saving tags in Outreach.
          s = s.replace("const tags=[...editingTags],siteTags=", "const tags=[...editingTags].filter(tag=>String(tag||'').trim().toLowerCase()!=='no site'),siteTags=")
          p.write_text(s)

          # Bump caches so Safari loads the new logic.
          p = Path('leads/index.html')
          s = p.read_text()
          s = re.sub(r'js\\.js\\?v=[^\"\']+', 'js.js?v=no-site-tag-removed-20260914-1', s)
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          s = re.sub(r'outreach\\.html\\?v=[^\"\']+', 'outreach.html?v=no-site-tag-removed-20260914-1', s)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'Merci-Chi'
          git config user.email 'actions@users.noreply.github.com'
          git add leads/js.js leads/index.html outreach.html index.html
          git commit -m 'Remove No Site as a CRM tag [skip ci]'
          git push
